<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频分类标注台 - 广东省文化馆</title>
    <style>
        :root {
            --primary: #1677ff;
            --primary-hover: #4096ff;
            --primary-light: #e6f4ff;
            --success: #52c41a;
            --success-light: #f6ffed;
            --warning: #faad14;
            --warning-light: #fff7e6;
            --error: #ff4d4f;
            --text: #262626;
            --text-secondary: #595959;
            --text-tertiary: #8c8c8c;
            --border: #d9d9d9;
            --border-light: #f0f0f0;
            --bg: #fafafa;
            --bg-white: #ffffff;
            --radius: 8px;
            --radius-sm: 6px;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.03);
            --shadow-hover: 0 4px 12px 0 rgba(0, 0, 0, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
            background: #f0f2f5;
            height: 100vh;
            overflow: hidden;
            display: flex;
            color: var(--text);
            font-size: 14px;
        }

        /* Left Sidebar */
        .sidebar { width: 200px; background: #1a1a2e; display: flex; flex-direction: column; height: 100vh; position: fixed; left: 0; top: 0; z-index: 10; }
        .sidebar-logo { padding: 20px 16px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-logo h1 { font-size: 14px; color: #fff; font-weight: 600; }
        .sidebar-logo span { font-size: 11px; color: var(--primary); display: block; margin-top: 4px; }
        .sidebar-nav { flex: 1; padding: 12px 0; overflow-y: auto; }
        .nav-item { display: flex; align-items: center; padding: 10px 16px; color: rgba(255,255,255,0.6); font-size: 13px; cursor: pointer; transition: all 0.2s; gap: 8px; user-select: none; border-right: 3px solid transparent; }
        .nav-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .nav-item.has-sub { justify-content: flex-start; }
        .nav-item.has-sub.open { background: rgba(74,158,255,0.15); color: var(--primary); border-right-color: var(--primary); }
        .nav-item .icon { width: 18px; text-align: center; font-size: 12px; color: #8c8c8c; flex-shrink: 0; }
        .nav-item .text { flex: 1; }
        .nav-item .arrow { font-size: 10px; color: rgba(255,255,255,0.4); transition: transform 0.2s; }
        .nav-item.has-sub.open .arrow { transform: rotate(90deg); }
        .nav-sub-list { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; background: rgba(0,0,0,0.15); }
        .nav-sub-item { display: flex; align-items: center; padding: 8px 16px 8px 42px; color: rgba(255,255,255,0.5); font-size: 12px; cursor: pointer; transition: all 0.2s; gap: 8px; }
        .nav-sub-item:hover { color: #fff; background: rgba(255,255,255,0.05); }
        .nav-sub-item.active { color: var(--primary); }
        .nav-sub-item .dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.3); flex-shrink: 0; }
        .nav-sub-item.active .dot { background: var(--primary); }
        .sidebar-footer { padding: 12px 16px; border-top: 1px solid rgba(255,255,255,0.1); }
        .user-info { display: flex; align-items: center; gap: 8px; }
        .user-avatar { width: 28px; height: 28px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; }
        .user-name { font-size: 12px; color: rgba(255,255,255,0.8); }
        .user-role { font-size: 10px; color: rgba(255,255,255,0.4); }

        /* Main area */
        .main { margin-left: 200px; flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* Topbar */
        .topbar {
            height: 48px;
            background: var(--bg-white);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            padding: 0 24px;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .topbar-breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-tertiary); }
        .topbar-breadcrumb span { color: var(--text); }
        .topbar-actions { display: flex; gap: 12px; }

        /* Button */
        .btn { height: 32px; padding: 0 14px; border-radius: var(--radius-sm); font-size: 13px; cursor: pointer; border: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s; font-weight: 500; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-default { background: var(--bg-white); border: 1px solid var(--border); color: var(--text); }
        .btn-default:hover { border-color: var(--primary); color: var(--primary); }

        /* Workbench */
        .workbench {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 12px 24px;
            background: #f0f2f5;
            max-height: 1000px;
            height: 1000px;
        }

        .wb-header {
            background: var(--bg-white);
            border-radius: var(--radius) var(--radius) 0 0;
            border: 1px solid var(--border-light);
            border-bottom: none;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .wb-header-left .wb-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
        .wb-header-left .wb-meta { font-size: 12px; color: var(--text-tertiary); display: flex; gap: 16px; flex-wrap: wrap; }
        .wb-header-right { display: flex; gap: 10px; align-items: center; }
        .divider-1, .divider-2 { height: 1px; background: var(--border-light); }
        .wb-nav {
            background: var(--bg-white);
            border-left: 1px solid var(--border-light);
            border-right: 1px solid var(--border-light);
            padding: 0 20px;
            display: flex;
            gap: 24px;
        }
        .wb-nav-item {
            padding: 10px 0;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
        }
        .wb-nav-item:hover { color: var(--text); }
        .wb-nav-item.active { color: var(--primary); border-bottom-color: var(--primary); }
        .wb-body {
            flex: 1;
            display: flex;
            overflow: hidden;
            background: var(--bg-white);
            border: 1px solid var(--border-light);
            border-top: none;
            min-height: 0;
        }

        /* 中间内容区 */
        .classification-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 视频播放器区域 */
        .video-section {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-light);
            background: var(--bg-white);
        }
        .video-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 12px;
        }
        .video-player-wrapper {
            background: #000;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-light);
            position: relative;
            height: 240px;
            overflow: hidden;
            cursor: pointer;
        }
        .video-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: rgba(255,255,255,0.6);
            flex-direction: column;
            gap: 12px;
        }
        .video-placeholder .play-icon { font-size: 48px; opacity: 0.8; }
        .video-placeholder .video-hint { font-size: 12px; }

        /* 时间轴 */
        .video-timeline {
            margin-top: 12px;
            background: var(--bg);
            border-radius: var(--radius-sm);
            padding: 8px 12px;
        }
        .timeline-scrubber {
            position: relative;
            height: 32px;
            cursor: pointer;
        }
        .timeline-track {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            left: 0;
            right: 0;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
        }
        .timeline-progress {
            position: absolute;
            height: 100%;
            background: var(--primary);
            border-radius: 2px;
            width: 0%;
        }
        .timeline-thumb {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 12px;
            height: 12px;
            background: var(--primary);
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 0 0 1px var(--primary);
        }
        .timeline-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 10px;
            color: var(--text-tertiary);
            padding: 0 4px;
        }

        /* 播放控制栏 */
        .playback-section {
            padding: 12px 20px;
            border-top: 1px solid var(--border-light);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            gap: 20px;
            background: var(--bg-white);
        }
        .play-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            border: none;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .play-btn:hover { background: var(--primary-hover); transform: scale(1.02); }
        .play-btn.playing { background: var(--warning); }
        .playback-info { display: flex; flex-direction: column; gap: 2px; }
        .playback-time { font-size: 13px; color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }
        .playback-duration { font-size: 11px; color: var(--text-tertiary); font-variant-numeric: tabular-nums; }
        
        .speed-group {
            display: flex;
            gap: 6px;
            align-items: center;
            background: var(--bg);
            padding: 4px 10px;
            border-radius: 24px;
            margin-left: auto;
        }
        .speed-group span { font-size: 11px; color: var(--text-tertiary); }
        .speed-btn {
            padding: 3px 10px;
            border: none;
            border-radius: 16px;
            background: transparent;
            font-size: 11px;
            cursor: pointer;
            color: var(--text-secondary);
        }
        .speed-btn:hover { background: var(--border-light); color: var(--text); }
        .speed-btn.active { background: var(--primary-light); color: var(--primary); font-weight: 500; }

        /* 标签选择区域 */
        .tags-section {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-light);
            background: var(--bg-white);
        }
        .tags-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 12px;
        }
        .tags-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .class-tag {
            padding: 8px 20px;
            border: 1px solid var(--border);
            border-radius: 32px;
            background: var(--bg-white);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .class-tag:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); transform: translateY(-1px); }
        .class-tag.active { background: var(--primary-light); border-color: var(--primary); color: var(--primary); font-weight: 500; box-shadow: var(--shadow-sm); }

        /* 已选标签展示 */
        .selected-tags-section {
            padding: 16px 20px;
            background: var(--bg-white);
        }
        .selected-tags-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .selected-tags-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .selected-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px 6px 16px;
            border-radius: 32px;
            font-size: 12px;
            background: #f0f5ff;
            border: 1px solid var(--primary-light);
            transition: all 0.2s;
        }
        .selected-tag .tag-name { color: var(--primary); font-weight: 500; }
        .remove-tag {
            color: var(--text-tertiary);
            cursor: pointer;
            font-size: 14px;
            width: 20px;
            height: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
        .remove-tag:hover { color: var(--error); background: rgba(255,77,79,0.1); }
        .count-badge {
            background: var(--bg);
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 500;
            padding: 2px 8px;
            border-radius: 12px;
        }

        /* 右侧边栏 */
        .wb-sidebar {
            width: 280px;
            border-left: 1px solid var(--border-light);
            overflow-y: auto;
            background: var(--bg-white);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }
        .wb-sidebar-section {
            padding: 16px 18px;
            border-bottom: 1px solid var(--border-light);
        }
        .wb-sidebar-section:last-child { border-bottom: none; }
        .wb-sidebar-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .wb-sidebar-item { display: flex; justify-content: space-between; padding: 8px 0; font-size: 12px; }
        .wb-sidebar-item .label { color: var(--text-tertiary); }
        .wb-sidebar-item .value { color: var(--text); font-weight: 500; }
        .wb-sidebar-item .value.green { color: var(--success); }
        .wb-sidebar-item .value.yellow { color: var(--warning); }
        .progress-bar { height: 6px; background: var(--border-light); border-radius: 3px; overflow: hidden; margin-top: 8px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), #69c0ff); border-radius: 3px; }
        .progress-text { font-size: 11px; color: var(--text-tertiary); margin-top: 6px; text-align: center; }

        /* Footer */
        .wb-footer {
            background: var(--bg-white);
            border: 1px solid var(--border-light);
            border-top: none;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 0 0 var(--radius) var(--radius);
        }
        .wb-footer-btns { display: flex; gap: 10px; }
        .wb-page-info { font-size: 12px; color: var(--text-tertiary); }
    </style>
</head>
<body>
