<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高质量数据集平台 - 上传本地文件</title>
    <style>
        :root {
            --primary: #1677ff;
            --primary-hover: #4096ff;
            --primary-light: #e6f4ff;
            --success: #52c41a;
            --success-light: #f6ffed;
            --warning: #faad14;
            --error: #ff4d4f;
            --text: #262626;
            --text-secondary: #595959;
            --text-tertiary: #8c8c8c;
            --border: #d9d9d9;
            --border-light: #f0f0f0;
            --bg-white: #ffffff;
            --radius: 8px;
            --radius-sm: 6px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif; background:#f0f2f5; height:100vh; overflow:hidden; display:flex; color:var(--text); font-size:14px; }

        .sidebar { width:220px; background:#1a1a2e; display:flex; flex-direction:column; height:100vh; position:fixed; left:0; top:0; z-index:100; }
        .sidebar-logo { padding:24px 20px; border-bottom:1px solid rgba(255,255,255,0.1); }
        .sidebar-logo h1 { font-size:16px; color:#fff; font-weight:600; }
        .sidebar-logo span { font-size:12px; color:var(--primary); display:block; margin-top:4px; }
        .sidebar-nav { flex:1; padding:12px 0; overflow-y:auto; }
        .nav-item { display:flex; align-items:center; padding:12px 20px; color:rgba(255,255,255,0.6); font-size:14px; cursor:pointer; gap:10px; border-right:3px solid transparent; }
        .nav-item:hover { background:rgba(255,255,255,0.05); color:#fff; }
        .nav-item.has-sub { justify-content:flex-start; }
        .nav-item.has-sub.open { background:rgba(74,158,255,0.15); color:var(--primary); border-right-color:var(--primary); }
        .nav-item .icon { width:20px; text-align:center; font-size:14px; font-weight:bold; color:#8c8c8c; flex-shrink:0; }
        .nav-item .text { flex:1; }
        .nav-item .arrow { font-size:10px; color:rgba(255,255,255,0.4); transition:transform 0.2s; }
        .nav-sub-list { display:none; background:rgba(0,0,0,0.15); }
        .nav-sub-list.open { display:block; }
        .nav-sub-item { display:flex; align-items:center; padding:10px 20px 10px 50px; color:rgba(255,255,255,0.5); font-size:13px; cursor:pointer; gap:8px; }
        .nav-sub-item:hover { color:#fff; background:rgba(255,255,255,0.05); }
        .nav-sub-item.active { color:var(--primary); }
        .nav-sub-item .dot { width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,0.3); flex-shrink:0; }
        .nav-sub-item.active .dot { background:var(--primary); }
        .sidebar-footer { padding:16px 20px; border-top:1px solid rgba(255,255,255,0.1); }
        .user-info { display:flex; align-items:center; gap:10px; }
        .user-avatar { width:32px; height:32px; background:var(--primary); border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-size:14px; }
        .user-name { font-size:13px; color:rgba(255,255,255,0.8); }
        .user-role { font-size:11px; color:rgba(255,255,255,0.4); }

        .main { margin-left:220px; flex:1; display:flex; flex-direction:column; height:100vh; overflow:hidden; }
        .topbar { height:56px; background:var(--bg-white); border-bottom:1px solid var(--border-light); display:flex; align-items:center; padding:0 24px; justify-content:space-between; }
        .topbar-breadcrumb { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-tertiary); }
        .topbar-breadcrumb a { color:var(--primary); text-decoration:none; }
        .topbar-actions { display:flex; gap:12px; }
        .content { flex:1; overflow-y:auto; padding:24px; }

        .form-section { background:var(--bg-white); border-radius:var(--radius); border:1px solid var(--border-light); padding:20px; margin-bottom:20px; }
        .form-section-title { font-size:14px; font-weight:600; color:var(--text); margin-bottom:16px; padding-bottom:10px; border-bottom:1px solid var(--border-light); }
        .form-row { display:grid; grid-template-columns:repeat(2,1fr); gap:20px; margin-bottom:16px; }
        .form-group { display:flex; flex-direction:column; gap:6px; }
        .form-label { font-size:13px; color:var(--text); font-weight:500; }
        .form-input, .form-select { height:36px; border:1px solid var(--border); border-radius:var(--radius-sm); padding:0 12px; font-size:14px; outline:none; background:var(--bg-white); width:100%; }
        .form-input:focus, .form-select:focus { border-color:var(--primary); box-shadow:0 0 0 2px rgba(22,119,255,0.1); }
        .form-actions { display:flex; gap:12px; margin-top:24px; padding-top:16px; border-top:1px solid var(--border-light); justify-content:flex-end; }

        .upload-area { border:2px dashed var(--border); border-radius:12px; padding:32px 24px; text-align:center; background:#fafafa; cursor:pointer; transition:all 0.2s; }
        .upload-area:hover { border-color:var(--primary); background:#f0f7ff; }
        .upload-area.drag-over { border-color:var(--primary); background:#e6f4ff; }
        .file-list { margin-top:16px; max-height:200px; overflow-y:auto; }
        .file-item { display:flex; justify-content:space-between; align-items:center; padding:8px 12px; background:#f8f9ff; border-radius:6px; margin-bottom:6px; font-size:12px; }
        .remove-file { color:var(--error); cursor:pointer; }

        .btn { height:34px; padding:0 16px; border-radius:var(--radius-sm); font-size:14px; cursor:pointer; border:none; display:inline-flex; align-items:center; justify-content:center; gap:6px; font-weight:500; }
        .btn-primary { background:var(--primary); color:#fff; }
        .btn-primary:hover { background:var(--primary-hover); }
        .btn-default { background:var(--bg-white); border:1px solid var(--border); color:var(--text); }
        .btn-default:hover { border-color:var(--primary); color:var(--primary); }
        .badge { display:inline-flex; align-items:center; justify-content:center; min-width:18px; height:18px; border-radius:9px; background:var(--error); color:#fff; font-size:11px; padding:0 5px; }
        .progress-bar { width:100%; height:6px; background:#f0f0f0; border-radius:3px; overflow:hidden; margin-top:12px; }
        .progress-fill { height:100%; background:var(--success); width:0%; transition:width 0.3s; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-logo"><h1>数据平台</h1><span>高质量数据集</span></div>
    <div class="sidebar-nav">
        <div class="nav-item"><span class="icon">◈</span><span class="text">工作台</span></div>
        <div class="nav-item"><span class="icon">☰</span><span class="text">数据资源</span></div>
        <div class="nav-item"><span class="icon">▦</span><span class="text">数据集管理</span></div>
        <div class="nav-item"><span class="icon">▤</span><span class="text">专题库</span></div>
        <div class="nav-item"><span class="icon">✎</span><span class="text">标注中心</span></div>
        <div class="nav-item"><span class="icon">⚙</span><span class="text">系统设置</span></div>
        </div>
    <div class="sidebar-footer">
        <div class="user-info"><div class="user-avatar">张</div><div><div class="user-name">张三</div><div class="user-role">标注员</div></div></div>
    </div>
</div>

<div class="main">
    <div class="topbar">
        <div class="topbar-breadcrumb"><span><a href="local_import_list.html">数据资源 / 本地导入</a> / 上传文件</span></div>
        <div class="topbar-actions"><button class="btn btn-default">🔔 <span class="badge">3</span></button><button class="btn btn-default">⚙ 设置</button></div>
    </div>
    <div class="content">
        <div class="form-section">
            <div class="form-section-title">上传本地文件</div>
            <div id="upload-area" class="upload-area" onclick="document.getElementById('file-input').click()">
                <div style="font-size:32px; margin-bottom:8px;">📁</div>
                <div style="font-size:14px; color:var(--text); margin-bottom:6px;">拖拽文件到此处，或 <span style="color:var(--primary);">点击上传</span></div>
                <div style="font-size:11px; color:var(--text-tertiary);">支持 CSV、Excel、JSON、TXT，单文件 ≤ 500MB</div>
                <input type="file" id="file-input" style="display:none;" multiple accept=".csv,.xlsx,.xls,.json,.txt">
            </div>
            <div id="file-list-container" class="file-list"></div>
            <div id="upload-progress" class="progress-bar" style="display:none;"><div class="progress-fill"></div></div>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:20px;">
                <div class="form-group">
                    <label class="form-label">数据域</label>
                    <select class="form-select" id="data-domain">
                        <option value="">请选择数据域（可选）</option>
                        <option value="活动域">活动域</option>
                        <option value="用户域">用户域</option>
                        <option value="内容域">内容域</option>
                        <option value="媒体域">媒体域</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">标签</label>
                    <input class="form-input" id="data-tags" placeholder="输入标签，多个用逗号分隔">
                </div>
            </div>

            <div class="form-actions">
                <button type="button" class="btn btn-default" onclick="window.location.href='local_import_list.html'">取消</button>
                <button type="button" class="btn btn-primary" id="upload-btn" disabled>开始上传</button>
            </div>
        </div>
    </div>
</div>

<script>
    let selectedFiles = [];

    const uploadArea = document.getElementById('upload-area');
    const fileInput = document.getElementById('file-input');
    const fileListContainer = document.getElementById('file-list-container');
    const uploadBtn = document.getElementById('upload-btn');
    const progressBar = document.getElementById('upload-progress');
    const progressFill = document.querySelector('.progress-fill');

    // 拖拽事件
    uploadArea.addEventListener('dragover', (e) => {
        e.preventDefault();
        uploadArea.classList.add('drag-over');
    });
    uploadArea.addEventListener('dragleave', () => {
        uploadArea.classList.remove('drag-over');
    });
    uploadArea.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadArea.classList.remove('drag-over');
        const files = Array.from(e.dataTransfer.files);
        addFiles(files);
    });
    fileInput.addEventListener('change', (e) => {
        addFiles(Array.from(e.target.files));
        fileInput.value = '';
    });

    function addFiles(files) {
        const validExtensions = ['.csv', '.xlsx', '.xls', '.json', '.txt'];
        for (let file of files) {
            const ext = file.name.substring(file.name.lastIndexOf('.')).toLowerCase();
            if (validExtensions.includes(ext) && file.size <= 500 * 1024 * 1024) {
                if (!selectedFiles.some(f => f.name === file.name)) {
                    selectedFiles.push(file);
                }
            } else {
                alert(`文件 ${file.name} 格式不支持或超过500MB`);
            }
        }
        renderFileList();
        uploadBtn.disabled = selectedFiles.length === 0;
    }

    function renderFileList() {
        if (!fileListContainer) return;
        fileListContainer.innerHTML = '';
        if (selectedFiles.length === 0) {
            fileListContainer.innerHTML = '<div style="text-align:center; padding:16px; color:var(--text-tertiary);">暂无选择文件</div>';
            return;
        }
        selectedFiles.forEach((file, idx) => {
            const div = document.createElement('div');
            div.className = 'file-item';
            div.innerHTML = `
                <span>📄 ${file.name} (${formatFileSize(file.size)})</span>
                <span class="remove-file" onclick="removeFile(${idx})">删除</span>
            `;
            fileListContainer.appendChild(div);
        });
    }

    function removeFile(idx) {
        selectedFiles.splice(idx, 1);
        renderFileList();
        uploadBtn.disabled = selectedFiles.length === 0;
    }

    function formatFileSize(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    async function uploadFiles() {
        if (selectedFiles.length === 0) return;
        uploadBtn.disabled = true;
        progressBar.style.display = 'block';
        progressFill.style.width = '0%';

        const domain = document.getElementById('data-domain').value;
        const tags = document.getElementById('data-tags').value;

        let successCount = 0;
        for (let i = 0; i < selectedFiles.length; i++) {
            const file = selectedFiles[i];
            progressFill.style.width = `${((i) / selectedFiles.length) * 100}%`;
            await simulateUpload(file);
            // 创建导入记录
            const newRecord = {
                id: Date.now() + '-' + i,
                name: file.name,
                size: formatFileSize(file.size),
                type: file.name.split('.').pop().toUpperCase(),
                uploadTime: new Date().toLocaleString(),
                user: '张三',
                status: '解析成功',
                count: Math.floor(Math.random() * 3000) + 100,
                statusClass: 'status-done'
            };
            addToLocalRecords(newRecord);
            successCount++;
        }
        progressFill.style.width = '100%';
        setTimeout(() => {
            alert(`上传完成！成功 ${successCount} 个文件`);
            window.location.href = 'local_import_list.html';
        }, 500);
    }

    function simulateUpload(file) {
        return new Promise(resolve => setTimeout(resolve, 800));
    }

    function addToLocalRecords(newRecord) {
        let records = [];
        const stored = localStorage.getItem('local_import_records');
        if (stored) {
            try {
                records = JSON.parse(stored);
            } catch(e) {}
        }
        records.unshift(newRecord);
        localStorage.setItem('local_import_records', JSON.stringify(records));

        // 添加一条成功日志
        let logs = [];
        const storedLogs = localStorage.getItem('local_import_error_logs');
        if (storedLogs) {
            try {
                logs = JSON.parse(storedLogs);
            } catch(e) {}
        }
        logs.unshift({
            time: new Date().toLocaleTimeString(),
            level: 'info',
            msg: `文件 ${newRecord.name} 上传成功，解析到 ${newRecord.count} 条数据`
        });
        if (logs.length > 20) logs.pop();
        localStorage.setItem('local_import_error_logs', JSON.stringify(logs));
    }

    uploadBtn.addEventListener('click', uploadFiles);
    renderFileList();
</script>
</body>
</html>
