<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高质量数据集平台 - 本地导入</title>
    <style>
        :root {
            --primary: #1677ff;
            --primary-hover: #4096ff;
            --primary-light: #e6f4ff;
            --success: #52c41a;
            --success-light: #f6ffed;
            --warning: #faad14;
            --warning-light: #fff7e6;
            --error: #ff4d4f;
            --text: #262626;
            --text-secondary: #595959;
            --text-tertiary: #8c8c8c;
            --border: #d9d9d9;
            --border-light: #f0f0f0;
            --bg-white: #ffffff;
            --shadow: 0 1px 2px rgba(0,0,0,0.03);
            --radius: 8px;
            --radius-sm: 6px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif; background:#f0f2f5; height:100vh; overflow:hidden; display:flex; color:var(--text); font-size:14px; }

        /* Sidebar */
        .sidebar { width:220px; background:#1a1a2e; display:flex; flex-direction:column; height:100vh; position:fixed; left:0; top:0; z-index:100; }
        .sidebar-logo { padding:24px 20px; border-bottom:1px solid rgba(255,255,255,0.1); }
        .sidebar-logo h1 { font-size:16px; color:#fff; font-weight:600; }
        .sidebar-logo span { font-size:12px; color:var(--primary); display:block; margin-top:4px; }
        .sidebar-nav { flex:1; padding:12px 0; overflow-y:auto; }
        .nav-item { display:flex; align-items:center; padding:12px 20px; color:rgba(255,255,255,0.6); font-size:14px; cursor:pointer; transition:all 0.2s; gap:10px; border-right:3px solid transparent; }
        .nav-item:hover { background:rgba(255,255,255,0.05); color:#fff; }
        .nav-item.has-sub { justify-content:flex-start; }
        .nav-item.has-sub.open { background:rgba(74,158,255,0.15); color:var(--primary); border-right-color:var(--primary); }
        .nav-item .icon { width:20px; text-align:center; font-size:14px; font-weight:bold; color:#8c8c8c; flex-shrink:0; }
        .nav-item .text { flex:1; }
        .nav-item .arrow { font-size:10px; color:rgba(255,255,255,0.4); transition:transform 0.2s; }
        .nav-item.has-sub.open .arrow { transform:rotate(90deg); }
        .nav-sub-list { display:none; background:rgba(0,0,0,0.15); }
        .nav-sub-list.open { display:block; }
        .nav-sub-item { display:flex; align-items:center; padding:10px 20px 10px 50px; color:rgba(255,255,255,0.5); font-size:13px; cursor:pointer; transition:all 0.2s; gap:8px; }
        .nav-sub-item:hover { color:#fff; background:rgba(255,255,255,0.05); }
        .nav-sub-item.active { color:var(--primary); }
        .nav-sub-item .dot { width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,0.3); flex-shrink:0; }
        .nav-sub-item.active .dot { background:var(--primary); }
        .sidebar-footer { padding:16px 20px; border-top:1px solid rgba(255,255,255,0.1); }
        .user-info { display:flex; align-items:center; gap:10px; }
        .user-avatar { width:32px; height:32px; background:var(--primary); border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-size:14px; }
        .user-name { font-size:13px; color:rgba(255,255,255,0.8); }
        .user-role { font-size:11px; color:rgba(255,255,255,0.4); }

        /* Main */
        .main { margin-left:220px; flex:1; display:flex; flex-direction:column; height:100vh; overflow:hidden; }
        .topbar { height:56px; background:var(--bg-white); border-bottom:1px solid var(--border-light); display:flex; align-items:center; padding:0 24px; justify-content:space-between; }
        .topbar-breadcrumb { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-tertiary); }
        .topbar-breadcrumb span { color:var(--text); }
        .topbar-actions { display:flex; gap:12px; }
        .content { flex:1; overflow-y:auto; padding:24px; }

        /* Card & Table */
        .card { background:var(--bg-white); border-radius:var(--radius); box-shadow:var(--shadow); border:1px solid var(--border-light); margin-bottom:20px; }
        .card-title { font-size:14px; font-weight:500; color:var(--text); padding:16px 20px; border-bottom:1px solid var(--border-light); display:flex; justify-content:space-between; align-items:center; }
        .overview-table { overflow-x:auto; }
        .overview-table table { width:100%; border-collapse:collapse; }
        .overview-table th { text-align:left; padding:12px 16px; font-size:12px; color:var(--text-secondary); font-weight:500; border-bottom:1px solid var(--border); background:#fafafa; }
        .overview-table td { padding:12px 16px; font-size:13px; border-bottom:1px solid var(--border-light); }
        .overview-table tr:hover td { background:#f8f9ff; }
        .status-tag { display:inline-block; padding:2px 8px; border-radius:4px; font-size:12px; border:1px solid; }
        .status-ing { background:var(--primary-light); color:var(--primary); border-color:#91cfff; }
        .status-done { background:var(--success-light); color:var(--success); border-color:#b7eb8f; }
        .status-wait { background:var(--warning-light); color:var(--warning); border-color:#ffd591; }
        .status-urgent { background:#fff1f0; color:#ff4d4f; border-color:#ffccc7; }
        .action-link { color:var(--primary); cursor:pointer; margin:0 6px; }
        .action-link:hover { text-decoration:underline; }
        .btn { height:34px; padding:0 16px; border-radius:var(--radius-sm); font-size:14px; cursor:pointer; border:none; display:inline-flex; align-items:center; justify-content:center; gap:6px; transition:all 0.2s; font-weight:500; }
        .btn-primary { background:var(--primary); color:#fff; }
        .btn-primary:hover { background:var(--primary-hover); }
        .btn-default { background:var(--bg-white); border:1px solid var(--border); color:var(--text); }
        .btn-default:hover { border-color:var(--primary); color:var(--primary); }
        .badge { display:inline-flex; align-items:center; justify-content:center; min-width:18px; height:18px; border-radius:9px; background:var(--error); color:#fff; font-size:11px; padding:0 5px; }
        .log-entry { display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1px solid var(--border-light); }
    </style>
</head>
<body>

<!-- 侧边栏 -->
<div class="sidebar">
    <div class="sidebar-logo">
        <h1>数据平台</h1>
        <span>高质量数据集</span>
    </div>
    <div class="sidebar-nav">
        <div class="nav-item"><span class="icon">◈</span><span class="text">工作台</span></div>
        <div class="nav-item has-sub open">
            <span class="icon">☰</span><span class="text">数据资源</span><span class="arrow">›</span>
        </div>
        <div class="nav-sub-list open" style="display:block;">
            <div class="nav-sub-item"><span class="dot"></span>系统导入</div>
            <div class="nav-sub-item"><span class="dot"></span>中台导入</div>
            <div class="nav-sub-item active"><span class="dot"></span>本地导入</div>
            <div class="nav-sub-item"><span class="dot"></span>互联网采集</div>
            <div class="nav-sub-item"><span class="dot"></span>资源存储</div>
        </div>
        <div class="nav-item has-sub"><span class="icon">▦</span><span class="text">数据集管理</span><span class="arrow">›</span></div>
        <div class="nav-item has-sub"><span class="icon">✎</span><span class="text">标注中心</span><span class="arrow">›</span></div>
        <div class="nav-item has-sub"><span class="icon">▤</span><span class="text">专题库</span><span class="arrow">›</span></div>
        <div class="nav-item has-sub"><span class="icon">⚙</span><span class="text">系统设置</span><span class="arrow">›</span></div>
    </div>
    <div class="sidebar-footer">
        <div class="user-info">
            <div class="user-avatar">张</div>
            <div><div class="user-name">张三</div><div class="user-role">标注员</div></div>
        </div>
    </div>
</div>

<div class="main">
    <div class="topbar">
        <div class="topbar-breadcrumb"><span>数据资源 / 本地导入</span></div>
        <div class="topbar-actions"><button class="btn btn-default">🔔 <span class="badge">3</span></button><button class="btn btn-default">⚙ 设置</button></div>
    </div>
    <div class="content">
        <!-- 导入记录卡片 -->
        <div class="card">
            <div class="card-title">
                <span>导入记录</span>
                <button class="btn btn-primary" onclick="window.location.href='local_import_add.html'" style="height:28px;font-size:12px;">+ 上传文件</button>
            </div>
            <div class="overview-table">
                <table>
                    <thead>
                        <tr><th>文件名称</th><th>文件大小</th><th>类型</th><th>上传时间</th><th>上传用户</th><th>解析状态</th><th>导入条数</th><th>操作</th></tr>
                    </thead>
                    <tbody id="import-records-body"></tbody>
                </table>
            </div>
            <div style="padding:12px 20px; display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--border-light);">
                <div style="font-size:12px;color:var(--text-tertiary);">共 <strong id="total-count">0</strong> 条记录</div>
                <div style="display:flex; gap:8px;">
                    <button class="btn btn-default" style="height:28px;font-size:12px;" onclick="prevPage()">‹ 上一页</button>
                    <span id="page-info" style="font-size:12px; line-height:28px;">第1页</span>
                    <button class="btn btn-default" style="height:28px;font-size:12px;" onclick="nextPage()">下一页 ›</button>
                </div>
            </div>
        </div>

        <!-- 错误日志卡片 -->
        <div class="card">
            <div class="card-title"><span>错误日志</span></div>
            <div id="error-logs-container" style="max-height:200px; overflow-y:auto; padding:0 16px 8px;"></div>
        </div>
    </div>
</div>

<script>
    // 模拟导入记录数据
    let importRecords = [
        { id:'r1', name:'文化活动数据_20260520.csv', size:'12.5 MB', type:'CSV', uploadTime:'2026-05-20 14:32', user:'张三', status:'解析成功', count:3240, statusClass:'status-done' },
        { id:'r2', name:'社区活动满意度问卷.xlsx', size:'3.2 MB', type:'Excel', uploadTime:'2026-05-19 10:15', user:'李四', status:'解析中', count:'—', statusClass:'status-ing' },
        { id:'r3', name:'非遗传承人数据.json', size:'8.7 MB', type:'JSON', uploadTime:'2026-05-18 16:45', user:'王五', status:'解析成功', count:1856, statusClass:'status-done' },
        { id:'r4', name:'活动文本采集_raw.txt', size:'25.1 MB', type:'TXT', uploadTime:'2026-05-17 09:20', user:'赵六', status:'待解析', count:'—', statusClass:'status-wait' },
        { id:'r5', name:'传统文化活动数据_0515.csv', size:'6.8 MB', type:'CSV', uploadTime:'2026-05-15 11:00', user:'陈七', status:'解析失败', count:0, statusClass:'status-urgent' },
        { id:'r6', name:'文化馆活动统计_20260514.xlsx', size:'4.1 MB', type:'Excel', uploadTime:'2026-05-14 16:30', user:'张三', status:'解析成功', count:2105, statusClass:'status-done' },
        { id:'r7', name:'街道文化活动汇总.csv', size:'9.3 MB', type:'CSV', uploadTime:'2026-05-13 10:00', user:'李四', status:'解析成功', count:4580, statusClass:'status-done' },
        { id:'r8', name:'群众文化需求调研.json', size:'2.8 MB', type:'JSON', uploadTime:'2026-05-12 14:20', user:'王五', status:'解析成功', count:1240, statusClass:'status-done' }
    ];

    let errorLogs = [
        { time:'05-15 11:02', level:'error', msg:'传统文化活动数据_0515.csv 第 <strong>245行</strong>：必填字段 <strong>title</strong> 为空，跳过该条' },
        { time:'05-15 11:02', level:'error', msg:'传统文化活动数据_0515.csv 第 <strong>892行</strong>：日期格式 2026/05/15 无法解析，请使用 YYYY-MM-DD 格式' },
        { time:'05-15 11:01', level:'warn', msg:'传统文化活动数据_0515.csv 第 <strong>108行</strong>：字段 category 值不在枚举范围内，已自动归类为"其他"' }
    ];

    let currentPage = 1;
    const pageSize = 5;

    function loadData() {
        // 从 localStorage 读取记录，实现跨页面同步
        const stored = localStorage.getItem('local_import_records');
        if (stored) {
            try {
                importRecords = JSON.parse(stored);
            } catch(e) {}
        }
        const storedLogs = localStorage.getItem('local_import_error_logs');
        if (storedLogs) {
            try {
                errorLogs = JSON.parse(storedLogs);
            } catch(e) {}
        }
        renderRecords();
        renderErrorLogs();
    }

    function renderRecords() {
        const tbody = document.getElementById('import-records-body');
        if (!tbody) return;
        const start = (currentPage - 1) * pageSize;
        const pageRecords = importRecords.slice(start, start + pageSize);
        tbody.innerHTML = '';
        pageRecords.forEach(rec => {
            const statusClass = rec.statusClass || (rec.status === '解析成功' ? 'status-done' : (rec.status === '解析中' ? 'status-ing' : (rec.status === '解析失败' ? 'status-urgent' : 'status-wait')));
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><span style="color:var(--primary);cursor:pointer;">${escapeHtml(rec.name)}</span></td>
                <td style="font-size:12px;">${escapeHtml(rec.size)}</td>
                <td><span class="status-tag status-done" style="font-size:11px;">${escapeHtml(rec.type)}</span></td>
                <td style="font-size:12px;">${escapeHtml(rec.uploadTime)}</td>
                <td style="font-size:12px;">${escapeHtml(rec.user)}</td>
                <td><span class="status-tag ${statusClass}">${escapeHtml(rec.status)}</span></td>
                <td style="font-size:12px;">${rec.count !== '—' ? rec.count.toLocaleString() + ' 条' : '—'}</td>
                <td><span class="action-link" onclick="viewDetail('${rec.id}')">详情</span><span class="action-link" onclick="deleteRecord('${rec.id}')" style="color:var(--error);">删除</span></td>
            `;
            tbody.appendChild(tr);
        });
        document.getElementById('total-count').innerText = importRecords.length;
        document.getElementById('page-info').innerText = `第${currentPage}页 / 共${Math.ceil(importRecords.length / pageSize)}页`;
        localStorage.setItem('local_import_records', JSON.stringify(importRecords));
    }

    function renderErrorLogs() {
        const container = document.getElementById('error-logs-container');
        if (!container) return;
        container.innerHTML = '';
        errorLogs.slice(0, 10).forEach(log => {
            const div = document.createElement('div');
            div.className = 'log-entry';
            const statusClass = log.level === 'error' ? 'fail' : 'info';
            const statusText = log.level === 'error' ? '错误' : '警告';
            div.innerHTML = `
                <div class="log-time" style="font-size:11px;color:var(--text-tertiary);width:60px;">${log.time}</div>
                <div class="log-status" style="font-size:11px;padding:2px 6px;border-radius:3px;${statusClass === 'fail' ? 'background:#fff1f0;color:#ff4d4f;' : 'background:var(--primary-light);color:var(--primary);'}">${statusText}</div>
                <div class="log-msg" style="font-size:13px;color:var(--text);flex:1;">${log.msg}</div>
            `;
            container.appendChild(div);
        });
    }

    function viewDetail(id) {
        alert(`查看详情：${id}（演示模式）`);
    }

    function deleteRecord(id) {
        if (confirm('确定删除该导入记录吗？')) {
            importRecords = importRecords.filter(r => r.id !== id);
            if (importRecords.length === 0 && currentPage > 1) currentPage = 1;
            renderRecords();
        }
    }

    function prevPage() {
        if (currentPage > 1) {
            currentPage--;
            renderRecords();
        }
    }

    function nextPage() {
        if (currentPage * pageSize < importRecords.length) {
            currentPage++;
            renderRecords();
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // 监听存储变化，实现跨页面同步
    window.addEventListener('storage', (e) => {
        if (e.key === 'local_import_records') loadData();
    });
    loadData();
</script>
</body>
</html>
