<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实体分类标注台 - 广东省文化馆</title>
    <style>
        :root {
            --primary: #1677ff;
            --primary-hover: #4096ff;
            --primary-light: #e6f4ff;
            --success: #52c41a;
            --success-light: #f6ffed;
            --warning: #faad14;
            --warning-light: #fff7e6;
            --error: #ff4d4f;
            --text: #262626;
            --text-secondary: #595959;
            --text-tertiary: #8c8c8c;
            --border: #d9d9d9;
            --border-light: #f0f0f0;
            --bg: #fafafa;
            --bg-white: #ffffff;
            --radius: 8px;
            --radius-sm: 6px;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.03);
            --shadow-hover: 0 4px 12px 0 rgba(0, 0, 0, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
            background: #f0f2f5;
            height: 100vh;
            overflow: hidden;
            display: flex;
            color: var(--text);
            font-size: 14px;
        }

        /* Left Sidebar */
        .sidebar { width: 200px; background: #1a1a2e; display: flex; flex-direction: column; height: 100vh; position: fixed; left: 0; top: 0; z-index: 10; }
        .sidebar-logo { padding: 20px 16px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-logo h1 { font-size: 14px; color: #fff; font-weight: 600; }
        .sidebar-logo span { font-size: 11px; color: var(--primary); display: block; margin-top: 4px; }
        .sidebar-nav { flex: 1; padding: 12px 0; overflow-y: auto; }
        .nav-item { display: flex; align-items: center; padding: 10px 16px; color: rgba(255,255,255,0.6); font-size: 13px; cursor: pointer; transition: all 0.2s; gap: 8px; user-select: none; border-right: 3px solid transparent; }
        .nav-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .nav-item.has-sub { justify-content: flex-start; }
        .nav-item.has-sub.open { background: rgba(74,158,255,0.15); color: var(--primary); border-right-color: var(--primary); }
        .nav-item .icon { width: 18px; text-align: center; font-size: 12px; color: #8c8c8c; flex-shrink: 0; }
        .nav-item .text { flex: 1; }
        .nav-item .arrow { font-size: 10px; color: rgba(255,255,255,0.4); transition: transform 0.2s; }
        .nav-item.has-sub.open .arrow { transform: rotate(90deg); }
        .nav-sub-list { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; background: rgba(0,0,0,0.15); }
        .nav-sub-item { display: flex; align-items: center; padding: 8px 16px 8px 42px; color: rgba(255,255,255,0.5); font-size: 12px; cursor: pointer; transition: all 0.2s; gap: 8px; }
        .nav-sub-item:hover { color: #fff; background: rgba(255,255,255,0.05); }
        .nav-sub-item.active { color: var(--primary); }
        .nav-sub-item .dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.3); flex-shrink: 0; }
        .nav-sub-item.active .dot { background: var(--primary); }
        .sidebar-footer { padding: 12px 16px; border-top: 1px solid rgba(255,255,255,0.1); }
        .user-info { display: flex; align-items: center; gap: 8px; }
        .user-avatar { width: 28px; height: 28px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; }
        .user-name { font-size: 12px; color: rgba(255,255,255,0.8); }
        .user-role { font-size: 10px; color: rgba(255,255,255,0.4); }

        /* Main area */
        .main { margin-left: 200px; flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* Topbar */
        .topbar {
            height: 48px;
            background: var(--bg-white);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            padding: 0 24px;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .topbar-breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-tertiary); }
        .topbar-breadcrumb span { color: var(--text); }
        .topbar-actions { display: flex; gap: 12px; }

        /* Button */
        .btn { height: 32px; padding: 0 14px; border-radius: var(--radius-sm); font-size: 13px; cursor: pointer; border: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s; font-weight: 500; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-default { background: var(--bg-white); border: 1px solid var(--border); color: var(--text); }
        .btn-default:hover { border-color: var(--primary); color: var(--primary); }

        /* Workbench */
        .workbench {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 12px 24px;
            background: #f0f2f5;
            max-height: 1000px;
            height: 1000px;
        }

        .wb-header {
            background: var(--bg-white);
            border-radius: var(--radius) var(--radius) 0 0;
            border: 1px solid var(--border-light);
            border-bottom: none;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .wb-header-left .wb-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
        .wb-header-left .wb-meta { font-size: 12px; color: var(--text-tertiary); display: flex; gap: 16px; flex-wrap: wrap; }
        .wb-header-right { display: flex; gap: 10px; align-items: center; }
        .divider-1, .divider-2 { height: 1px; background: var(--border-light); }
        .wb-nav {
            background: var(--bg-white);
            border-left: 1px solid var(--border-light);
            border-right: 1px solid var(--border-light);
            padding: 0 20px;
            display: flex;
            gap: 24px;
        }
        .wb-nav-item {
            padding: 10px 0;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
        }
        .wb-nav-item:hover { color: var(--text); }
        .wb-nav-item.active { color: var(--primary); border-bottom-color: var(--primary); }
        .wb-body {
            flex: 1;
            display: flex;
            overflow: hidden;
            background: var(--bg-white);
            border: 1px solid var(--border-light);
            border-top: none;
            min-height: 0;
        }

        /* 中间标注区 - 全宽 */
        .annotation-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .annotation-header {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg);
        }
        .annotation-header-left { font-size: 13px; color: var(--text); font-weight: 500; }
        .annotation-header-right { font-size: 11px; color: var(--text-tertiary); display: flex; gap: 16px; }
        .annotation-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        /* 文本卡片 */
        .text-card {
            background: var(--bg);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid var(--border-light);
        }
        .text-card-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
        .text-card-meta { display: flex; gap: 16px; font-size: 11px; color: var(--text-tertiary); margin-bottom: 16px; }
        .text-card-content {
            font-size: 15px;
            line-height: 2.2;
            color: var(--text);
            user-select: text;
        }

        /* 实体高亮样式 */
        .entity {
            display: inline;
            padding: 2px 6px;
            margin: 0 2px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
            border-bottom: 2px solid;
        }
        .entity:hover { opacity: 0.75; transform: scale(1.01); }
        .entity-person { background: rgba(22,119,255,0.12); color: #1677ff; border-bottom-color: #1677ff; }
        .entity-location { background: rgba(82,196,26,0.12); color: #52c41a; border-bottom-color: #52c41a; }
        .entity-org { background: rgba(114,46,209,0.12); color: #722ed1; border-bottom-color: #722ed1; }
        .entity-time { background: rgba(250,173,20,0.12); color: #faad14; border-bottom-color: #faad14; }
        .entity-activity { background: rgba(255,77,79,0.12); color: #ff4d4f; border-bottom-color: #ff4d4f; }

        /* 标注操作区 */
        .annotation-area { margin-top: 8px; }
        .annotation-area-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 12px; }
        .type-toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .type-btn {
            padding: 6px 20px;
            border: 1px solid var(--border);
            border-radius: 24px;
            background: var(--bg-white);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .type-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); transform: translateY(-1px); }
        .type-btn.active { font-weight: 600; box-shadow: var(--shadow-sm); }
        .type-btn[data-type="person"].active { background: rgba(22,119,255,0.12); border-color: #1677ff; color: #1677ff; }
        .type-btn[data-type="location"].active { background: rgba(82,196,26,0.12); border-color: #52c41a; color: #52c41a; }
        .type-btn[data-type="org"].active { background: rgba(114,46,209,0.12); border-color: #722ed1; color: #722ed1; }
        .type-btn[data-type="time"].active { background: rgba(250,173,20,0.12); border-color: #faad14; color: #faad14; }
        .type-btn[data-type="activity"].active { background: rgba(255,77,79,0.12); border-color: #ff4d4f; color: #ff4d4f; }

        .annotation-hint {
            font-size: 11px;
            color: var(--text-tertiary);
            margin-bottom: 20px;
            padding: 8px 12px;
            background: var(--bg);
            border-radius: var(--radius-sm);
            border-left: 3px solid var(--primary);
        }

        /* 标注结果展示 */
        .entity-result {
            margin-top: 20px;
            border-top: 1px solid var(--border-light);
            padding-top: 16px;
        }
        .entity-result-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 12px; }
        .entity-tags { display: flex; flex-wrap: wrap; gap: 10px; }
        .entity-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            background: #f9fafb;
            border: 1px solid var(--border-light);
            transition: all 0.2s;
        }
        .entity-tag:hover { background: var(--bg-white); box-shadow: var(--shadow-sm); }
        .entity-tag-dot { width: 8px; height: 8px; border-radius: 50%; }
        .entity-tag[data-type="person"] .entity-tag-dot { background: #1677ff; }
        .entity-tag[data-type="location"] .entity-tag-dot { background: #52c41a; }
        .entity-tag[data-type="org"] .entity-tag-dot { background: #722ed1; }
        .entity-tag[data-type="time"] .entity-tag-dot { background: #faad14; }
        .entity-tag[data-type="activity"] .entity-tag-dot { background: #ff4d4f; }
        .entity-tag-label { color: var(--text-secondary); font-size: 11px; }
        .entity-tag-value { font-weight: 600; font-size: 12px; }
        .entity-tag[data-type="person"] .entity-tag-value { color: #1677ff; }
        .entity-tag[data-type="location"] .entity-tag-value { color: #52c41a; }
        .entity-tag[data-type="org"] .entity-tag-value { color: #722ed1; }
        .entity-tag[data-type="time"] .entity-tag-value { color: #faad14; }
        .entity-tag[data-type="activity"] .entity-tag-value { color: #ff4d4f; }
        .delete-entity {
            color: var(--text-tertiary);
            cursor: pointer;
            margin-left: 6px;
            font-size: 12px;
            width: 18px;
            height: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
        .delete-entity:hover { color: var(--error); background: rgba(255,77,79,0.1); }

        /* 右侧边栏 */
        .wb-sidebar {
            width: 280px;
            border-left: 1px solid var(--border-light);
            overflow-y: auto;
            background: var(--bg-white);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }
        .wb-sidebar-section {
            padding: 16px 18px;
            border-bottom: 1px solid var(--border-light);
        }
        .wb-sidebar-section:last-child { border-bottom: none; }
        .wb-sidebar-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .wb-sidebar-title .count-badge {
            background: var(--bg);
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 500;
            padding: 2px 8px;
            border-radius: 12px;
        }
        .wb-sidebar-item { display: flex; justify-content: space-between; padding: 8px 0; font-size: 12px; }
        .wb-sidebar-item .label { color: var(--text-tertiary); }
        .wb-sidebar-item .value { color: var(--text); font-weight: 500; }
        .wb-sidebar-item .value.green { color: var(--success); }
        .wb-sidebar-item .value.yellow { color: var(--warning); }
        .progress-bar { height: 6px; background: var(--border-light); border-radius: 3px; overflow: hidden; margin-top: 8px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), #69c0ff); border-radius: 3px; }
        .progress-text { font-size: 11px; color: var(--text-tertiary); margin-top: 6px; text-align: center; }

        /* Footer */
        .wb-footer {
            background: var(--bg-white);
            border: 1px solid var(--border-light);
            border-top: none;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 0 0 var(--radius) var(--radius);
        }
        .wb-footer-btns { display: flex; gap: 10px; }
        .wb-page-info { font-size: 12px; color: var(--text-tertiary); }
    </style>
</head>
<body>

    <div class="sidebar-logo">
        <h1>数据集管理平台</h1>

</div>
