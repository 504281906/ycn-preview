<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>广东省文化馆 - 标注大厅</title>
<style>
:root {
--primary: #1677ff;
--primary-hover: #4096ff;
--primary-light: #e6f4ff;
--success: #52c41a;
--success-light: #f6ffed;
--warning: #faad14;
--warning-light: #fff7e6;
--error: #ff4d4f;
--error-light: #fff1f0;
--text: #262626;
--text-secondary: #595959;
--text-tertiary: #8c8c8c;
--text-quaternary: #bfbfbf;
--border: #d9d9d9;
--border-light: #f0f0f0;
--bg: #fafafa;
--bg-white: #ffffff;
--shadow: 0 1px 2px rgba(0,0,0,0.03), 0 1px 6px -1px rgba(0,0,0,0.02);
--radius: 8px;
--radius-sm: 6px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    background: #f0f2f5;
    height: 100vh;
    overflow: hidden;
    display: flex;
    color: var(--text);
    font-size: 14px;
}

/* Sidebar */
.sidebar {
    width: 220px;
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    height: 100vh;
    position: fixed;
    left: 0;
    top: 0;
    z-index: 100;
}
.sidebar-logo { padding: 24px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
.sidebar-logo h1 { font-size: 16px; color: #fff; font-weight: 600; }
.sidebar-logo span { font-size: 12px; color: var(--primary); display: block; margin-top: 4px; }
.sidebar-nav { flex: 1; padding: 12px 0; overflow-y: auto; }
.nav-item {
    display: flex;
    align-items: center;
    padding: 12px 20px;
    color: rgba(255,255,255,0.6);
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
    gap: 10px;
    border-right: 3px solid transparent;
}
.nav-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
.nav-item.active { background: rgba(74,158,255,0.15); color: var(--primary); border-right-color: var(--primary); }
.nav-item .icon { width: 20px; text-align: center; font-size: 14px; flex-shrink: 0; }
.nav-item .text { flex: 1; }
.sidebar-footer { padding: 16px 20px; border-top: 1px solid rgba(255,255,255,0.1); }
.user-info { display: flex; align-items: center; gap: 10px; }
.user-avatar {
    width: 32px;
    height: 32px;
    background: var(--primary);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 14px;
}
.user-name { font-size: 13px; color: rgba(255,255,255,0.8); }
.user-role { font-size: 11px; color: rgba(255,255,255,0.4); }

/* Main */
.main {
    margin-left: 220px;
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
}
.topbar {
    height: 56px;
    background: var(--bg-white);
    border-bottom: 1px solid var(--border-light);
    display: flex;
    align-items: center;
    padding: 0 24px;
    justify-content: space-between;
}
.topbar-title { font-size: 15px; color: var(--text); font-weight: 500; }
.topbar-actions { display: flex; gap: 12px; }
.content {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
}

/* 卡片 */
.card {
    background: var(--bg-white);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1px solid var(--border-light);
    margin-bottom: 24px;
}
.card-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border-light);
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.card-header h3 {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
}

/* Tabs */
.tabs {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--border-light);
    background: var(--bg-white);
    border-radius: var(--radius) var(--radius) 0 0;
    padding: 0 20px;
}
.tab {
    padding: 12px 20px;
    font-size: 14px;
    color: var(--text-secondary);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: all 0.2s;
}
.tab:hover { color: var(--text); }
.tab.active {
    color: var(--primary);
    border-bottom-color: var(--primary);
}

/* 表格 */
.data-table {
    width: 100%;
    border-collapse: collapse;
}
.data-table th {
    text-align: left;
    padding: 12px 16px;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
    background: #fafafa;
    border-bottom: 1px solid var(--border);
}
.data-table td {
    padding: 12px 16px;
    font-size: 13px;
    border-bottom: 1px solid var(--border-light);
}
.data-table tr:hover td { background: #f8f9ff; }

/* 按钮 */
.btn {
    height: 32px;
    padding: 0 14px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    cursor: pointer;
    border: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
    font-weight: 500;
}
.btn-primary {
    background: var(--primary);
    color: #fff;
}
.btn-primary:hover { background: var(--primary-hover); }
.btn-default {
    background: var(--bg-white);
    border: 1px solid var(--border);
    color: var(--text);
}
.btn-default:hover {
    border-color: var(--primary);
    color: var(--primary);
}
.btn-compact {
    height: 28px;
    padding: 0 12px;
    font-size: 12px;
    border-radius: 4px;
}
.btn-outline {
    background: transparent;
    border: 1px solid var(--primary);
    color: var(--primary);
}
.btn-outline:hover {
    background: var(--primary-light);
}

/* 状态标签 */
.status-tag {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 4px;
    font-size: 12px;
    border: 1px solid;
}
.status-pending {
    background: var(--warning-light);
    color: var(--warning);
    border-color: #ffd591;
}
.status-progress {
    background: var(--primary-light);
    color: var(--primary);
    border-color: #91cfff;
}
.status-done {
    background: var(--success-light);
    color: var(--success);
    border-color: #b7eb8f;
}
.badge-count {
    background: var(--primary-light);
    color: var(--primary);
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 11px;
    margin-left: 8px;
}
.filter-bar {
    padding: 12px 20px;
    display: flex;
    gap: 12px;
    border-bottom: 1px solid var(--border-light);
    flex-wrap: wrap;
}
.filter-input {
    height: 32px;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0 12px;
    font-size: 13px;
    width: 180px;
    outline: none;
}
.filter-input:focus { border-color: var(--primary); }
.filter-select {
    height: 32px;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0 12px;
    font-size: 13px;
    width: 140px;
    outline: none;
    background: var(--bg-white);
    cursor: pointer;
}
.pagination {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 16px;
    padding: 12px 20px;
    border-top: 1px solid var(--border-light);
}
.pagination-info { font-size: 12px; color: var(--text-tertiary); }
.pagination-buttons { display: flex; gap: 8px; }

/* 可领取任务卡片网格 */
.tasks-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
    padding: 20px;
}
.task-card {
    background: var(--bg-white);
    border: 1px solid var(--border-light);
    border-radius: var(--radius);
    padding: 16px;
    transition: all 0.2s;
}
.task-card:hover {
    border-color: var(--primary);
    box-shadow: var(--shadow);
}
.task-card .task-id {
    font-size: 11px;
    color: var(--text-tertiary);
    font-family: monospace;
    margin-bottom: 8px;
}
.task-card .task-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 8px;
}
.task-card .task-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
    font-size: 12px;
}
.task-card .remaining {
    color: var(--success);
    font-weight: 500;
}
.empty-state {
    text-align: center;
    padding: 60px;
    color: var(--text-tertiary);
}
</style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-logo">
        <h1>广东省文化馆</h1>
        <span>非遗数字化保护平台</span>
    </div>
    <div class="sidebar-nav">
        <div class="nav-item"><span class="icon">◈</span><span class="text">工作台</span></div>
        <div class="nav-item"><span class="icon">☰</span><span class="text">数据资源</span></div>
        <div class="nav-item"><span class="icon">▦</span><span class="text">数据集管理</span></div>
        <div class="nav-item"><span class="icon">▤</span><span class="text">专题库</span></div>
        <div class="nav-item"><span class="icon">✎</span><span class="text">标注中心</span></div>
        <div class="nav-item"><span class="icon">⚙</span><span class="text">系统设置</span></div>
        </div>
    <div class="sidebar-footer">
        <div class="user-info"><div class="user-avatar">陈</div><div><div class="user-name">陈敏</div><div class="user-role">非遗标注员</div></div></div>
    </div>
</div>

<div class="main">
    <div class="topbar">
        <div class="topbar-title">标注中心 / 标注大厅</div>
        <div class="topbar-actions"><button class="btn btn-default btn-compact">帮助</button></div>
    </div>
    <div class="content">
        <!-- Tab 切换 -->
        <div class="card" style="margin-bottom: 0;">
            <div class="tabs">
                <div class="tab active" data-tab="annotation">标注任务</div>
                <div class="tab" data-tab="quality">质检任务</div>
            </div>
        </div>

        <!-- 标注任务面板 -->
        <div id="annotationPanel">
            <!-- 待标注列表 -->
            <div class="card">
                <div class="card-header">
                    <h3>📋 待标注列表 <span class="badge-count" id="pendingCount">0</span></h3>
                </div>
                <div class="filter-bar">
                    <input type="text" id="searchPending" class="filter-input" placeholder="搜索任务名称 / ID">
                    <select id="typePendingFilter" class="filter-select">
                        <option value="">全部类型</option>
                        <option value="图片">图像标注</option>
                        <option value="文本">文本标注</option>
                        <option value="音频">音频标注</option>
                        <option value="视频">视频标注</option>
                    </select>
                    <button class="btn btn-default btn-compact" id="searchPendingBtn">查询</button>
                    <button class="btn btn-default btn-compact" id="resetPendingBtn">重置</button>
                </div>
                <div style="overflow-x: auto;">
                    <table class="data-table">
                        <thead>
                            <tr><th>子任务ID</th><th>任务名称</th><th>任务ID</th><th>任务来源</th><th>标注状态</th><th>操作</th></tr>
                        </thead>
                        <tbody id="pendingTableBody"></tbody>
                    </table>
                </div>
                <div class="pagination">
                    <div class="pagination-info">共 <strong id="pendingTotalCount">0</strong> 条记录</div>
                    <div class="pagination-buttons">
                        <button class="btn btn-default btn-compact" id="pendingPrevBtn" disabled>‹ 上一页</button>
                        <span id="pendingPageInfo" style="font-size:12px;">第1页</span>
                        <button class="btn btn-default btn-compact" id="pendingNextBtn">下一页 ›</button>
                    </div>
                </div>
            </div>

            <!-- 可领取的任务 -->
            <div class="card">
                <div class="card-header">
                    <h3>🎯 可领取的任务 <span class="badge-count" id="claimableCount">0</span></h3>
                </div>
                <div class="filter-bar">
                    <input type="text" id="searchClaimable" class="filter-input" placeholder="搜索任务名称">
                    <button class="btn btn-default btn-compact" id="searchClaimableBtn">查询</button>
                    <button class="btn btn-default btn-compact" id="resetClaimableBtn">重置</button>
                </div>
                <div id="claimableGrid" class="tasks-grid"></div>
                <div class="pagination">
                    <div class="pagination-info">共 <strong id="claimableTotalCount">0</strong> 个任务</div>
                    <div class="pagination-buttons">
                        <button class="btn btn-default btn-compact" id="claimablePrevBtn" disabled>‹ 上一页</button>
                        <span id="claimablePageInfo" style="font-size:12px;">第1页</span>
                        <button class="btn btn-default btn-compact" id="claimableNextBtn">下一页 ›</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 质检任务面板（初始隐藏） -->
        <div id="qualityPanel" style="display: none;">
            <div class="card">
                <div class="card-header">
                    <h3>✅ 待质检列表 <span class="badge-count" id="qualityPendingCount">0</span></h3>
                </div>
                <div class="filter-bar">
                    <input type="text" id="searchQuality" class="filter-input" placeholder="搜索任务名称 / ID">
                    <button class="btn btn-default btn-compact" id="searchQualityBtn">查询</button>
                    <button class="btn btn-default btn-compact" id="resetQualityBtn">重置</button>
                </div>
                <div style="overflow-x: auto;">
                    <table class="data-table">
                        <thead><tr><th>子任务ID</th><th>任务名称</th><th>任务ID</th><th>提交人</th><th>提交时间</th><th>质检状态</th><th>操作</th></tr></thead>
                        <tbody id="qualityTableBody"></tbody>
                    </table>
                </div>
                <div class="pagination">
                    <div class="pagination-info">共 <strong id="qualityTotalCount">0</strong> 条记录</div>
                    <div class="pagination-buttons">
                        <button class="btn btn-default btn-compact" id="qualityPrevBtn" disabled>‹ 上一页</button>
                        <span id="qualityPageInfo" style="font-size:12px;">第1页</span>
                        <button class="btn btn-default btn-compact" id="qualityNextBtn">下一页 ›</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// ========== 广东省文化馆 - 非遗标注演示数据 ==========

// 待标注任务数据（已领取但未完成）
let pendingTasks = [
    { subId: "SUB-001", taskName: "粤剧脸谱图像标注", taskId: "NIC-001", taskSource: "非遗数字化项目", type: "图片", status: "进行中" },
    { subId: "SUB-002", taskName: "广东音乐情感分析", taskId: "NIC-002", taskSource: "音频数字化项目", type: "音频", status: "进行中" },
    { subId: "SUB-003", taskName: "潮汕工夫茶艺动作识别", taskId: "NIC-003", taskSource: "视频采集项目", type: "视频", status: "待标注" },
    { subId: "SUB-004", taskName: "佛山木版年画OCR", taskId: "NIC-004", taskSource: "文物数字化", type: "图片", status: "待标注" },
    { subId: "SUB-005", taskName: "客家山歌转写", taskId: "NIC-005", taskSource: "民歌采集", type: "音频", status: "进行中" },
    { subId: "SUB-006", taskName: "岭南建筑构件检测", taskId: "NIC-006", taskSource: "古建测绘", type: "图片", status: "待标注" }
];

// 可领取任务数据
let claimableTasks = [
    { id: "2056975074808066048", name: "粤剧-实体识别", type: "文本标注", remaining: 32, source: "非遗文本库" },
    { id: "2056975074808066049", name: "广东醒狮动作检测", type: "视频标注", remaining: 15, source: "民俗活动记录" },
    { id: "2056975074808066050", name: "广绣纹样分类", type: "图像标注", remaining: 48, source: "传统美术数字化" },
    { id: "2056975074808066051", name: "潮州木雕构件标注", type: "目标检测", remaining: 24, source: "建筑遗产保护" },
    { id: "2056975074808066052", name: "广东汉剧唱词转写", type: "文本标注", remaining: 56, source: "戏曲数字化" },
    { id: "2056975074808066053", name: "石湾陶塑分类", type: "图像分类", remaining: 38, source: "陶瓷艺术研究" }
];

// 质检任务数据
let qualityTasks = [
    { subId: "QS-001", taskName: "粤剧脸谱图像标注", taskId: "NIC-001", submitter: "李华", submitTime: "2025-05-20 14:30", status: "待质检" },
    { subId: "QS-002", taskName: "广东音乐情感分析", taskId: "NIC-002", submitter: "王芳", submitTime: "2025-05-21 10:15", status: "待质检" },
    { subId: "QS-003", taskName: "潮汕工夫茶艺动作识别", taskId: "NIC-003", submitter: "赵雷", submitTime: "2025-05-21 16:00", status: "待质检" }
];

// 分页状态
let pendingPage = 1;
let claimablePage = 1;
let qualityPage = 1;
const pageSize = 5;
const claimablePageSize = 4;

// 筛选状态
let pendingSearch = "";
let pendingTypeFilter = "";
let claimableSearch = "";
let qualitySearch = "";

// 获取状态标签样式
function getStatusTag(status) {
    if (status === "进行中") return '<span class="status-tag status-progress">进行中</span>';
    if (status === "待标注") return '<span class="status-tag status-pending">待标注</span>';
    if (status === "待质检") return '<span class="status-tag status-pending">待质检</span>';
    return '<span class="status-tag">' + status + '</span>';
}

// 渲染待标注列表
function renderPendingTable() {
    let filtered = pendingTasks.filter(t => {
        let matchSearch = pendingSearch === "" || t.taskName.toLowerCase().includes(pendingSearch) || t.subId.toLowerCase().includes(pendingSearch);
        let matchType = pendingTypeFilter === "" || t.type === pendingTypeFilter;
        return matchSearch && matchType;
    });
    let totalPages = Math.ceil(filtered.length / pageSize);
    if (pendingPage > totalPages) pendingPage = Math.max(1, totalPages);
    let start = (pendingPage - 1) * pageSize;
    let paginated = filtered.slice(start, start + pageSize);
    let tbody = document.getElementById("pendingTableBody");
    tbody.innerHTML = "";
    paginated.forEach(t => {
        let row = `<tr>
            <td style="font-family:monospace;">${t.subId}</td>
            <td><strong>${t.taskName}</strong></td>
            <td style="font-family:monospace;">${t.taskId}</td>
            <td>${t.taskSource}</td>
            <td>${getStatusTag(t.status)}</td>
            <td><button class="btn btn-primary btn-compact" onclick="startAnnotation('${t.subId}')">标注</button>
                <button class="btn btn-outline btn-compact" style="margin-left:8px;" onclick="releaseTask('${t.subId}')">释放</button></td>
        </tr>`;
        tbody.insertAdjacentHTML('beforeend', row);
    });
    document.getElementById("pendingTotalCount").innerText = filtered.length;
    document.getElementById("pendingPageInfo").innerText = `第${pendingPage}页 / 共${totalPages || 1}页`;
    document.getElementById("pendingPrevBtn").disabled = pendingPage <= 1;
    document.getElementById("pendingNextBtn").disabled = pendingPage >= totalPages;
    document.getElementById("pendingCount").innerText = filtered.length;
}

// 渲染可领取任务（卡片形式）
function renderClaimableGrid() {
    let filtered = claimableTasks.filter(t => claimableSearch === "" || t.name.toLowerCase().includes(claimableSearch));
    let totalPages = Math.ceil(filtered.length / claimablePageSize);
    if (claimablePage > totalPages) claimablePage = Math.max(1, totalPages);
    let start = (claimablePage - 1) * claimablePageSize;
    let paginated = filtered.slice(start, start + claimablePageSize);
    let container = document.getElementById("claimableGrid");
    container.innerHTML = "";
    if (paginated.length === 0) {
        container.innerHTML = '<div class="empty-state">暂无可领取的任务</div>';
    } else {
        paginated.forEach(t => {
            let card = `
                <div class="task-card">
                    <div class="task-id">ID: ${t.id}</div>
                    <div class="task-name">${t.name}</div>
                    <div class="task-meta">
                        <span>📁 ${t.type}</span>
                        <span>📌 ${t.source}</span>
                    </div>
                    <div class="task-meta">
                        <span class="remaining">剩余余量: ${t.remaining} 条</span>
                        <button class="btn btn-primary btn-compact" onclick="claimTask('${t.id}')">领取任务</button>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', card);
        });
    }
    document.getElementById("claimableTotalCount").innerText = filtered.length;
    document.getElementById("claimablePageInfo").innerText = `第${claimablePage}页 / 共${totalPages || 1}页`;
    document.getElementById("claimablePrevBtn").disabled = claimablePage <= 1;
    document.getElementById("claimableNextBtn").disabled = claimablePage >= totalPages;
    document.getElementById("claimableCount").innerText = filtered.length;
}

// 渲染质检列表
function renderQualityTable() {
    let filtered = qualityTasks.filter(t => qualitySearch === "" || t.taskName.toLowerCase().includes(qualitySearch) || t.subId.toLowerCase().includes(qualitySearch));
    let totalPages = Math.ceil(filtered.length / pageSize);
    if (qualityPage > totalPages) qualityPage = Math.max(1, totalPages);
    let start = (qualityPage - 1) * pageSize;
    let paginated = filtered.slice(start, start + pageSize);
    let tbody = document.getElementById("qualityTableBody");
    tbody.innerHTML = "";
    paginated.forEach(t => {
        let row = `<tr>
            <td style="font-family:monospace;">${t.subId}</td>
            <td><strong>${t.taskName}</strong></td>
            <td style="font-family:monospace;">${t.taskId}</td>
            <td>${t.submitter}</td>
            <td>${t.submitTime}</td>
            <td>${getStatusTag(t.status)}</td>
            <td><button class="btn btn-primary btn-compact" onclick="startQuality('${t.subId}')">质检</button></td>
        </tr>`;
        tbody.insertAdjacentHTML('beforeend', row);
    });
    document.getElementById("qualityTotalCount").innerText = filtered.length;
    document.getElementById("qualityPageInfo").innerText = `第${qualityPage}页 / 共${totalPages || 1}页`;
    document.getElementById("qualityPrevBtn").disabled = qualityPage <= 1;
    document.getElementById("qualityNextBtn").disabled = qualityPage >= totalPages;
    document.getElementById("qualityPendingCount").innerText = filtered.length;
}

// Tab 切换
function switchTab(tabName) {
    const annotationPanel = document.getElementById("annotationPanel");
    const qualityPanel = document.getElementById("qualityPanel");
    const tabs = document.querySelectorAll(".tab");
    tabs.forEach(tab => {
        if (tab.getAttribute("data-tab") === tabName) {
            tab.classList.add("active");
        } else {
            tab.classList.remove("active");
        }
    });
    if (tabName === "annotation") {
        annotationPanel.style.display = "block";
        qualityPanel.style.display = "none";
        renderPendingTable();
        renderClaimableGrid();
    } else {
        annotationPanel.style.display = "none";
        qualityPanel.style.display = "block";
        renderQualityTable();
    }
}

// 操作函数（弹窗提示，不跳转）
function startAnnotation(subId) {
    alert(`开始标注任务: ${subId}\n在实际系统中会跳转到标注工作台。`);
}
function releaseTask(subId) {
    if (confirm(`确定要释放任务 ${subId} 吗？释放后将回到可领取列表。`)) {
        let task = pendingTasks.find(t => t.subId === subId);
        if (task) {
            // 移动到可领取列表
            claimableTasks.unshift({
                id: "REL-" + Date.now().toString().slice(-6),
                name: task.taskName,
                type: task.type === "图片" ? "图像标注" : (task.type === "音频" ? "音频标注" : "文本标注"),
                remaining: 20,
                source: task.taskSource
            });
            pendingTasks = pendingTasks.filter(t => t.subId !== subId);
            renderPendingTable();
            renderClaimableGrid();
            alert(`任务 ${task.taskName} 已释放`);
        }
    }
}
function claimTask(taskId) {
    let task = claimableTasks.find(t => t.id === taskId);
    if (task) {
        alert(`领取任务成功！\n任务名称: ${task.name}\n在实际系统中会跳转到标注工作台。`);
        // 演示：从可领取列表中移除并添加到待标注列表
        claimableTasks = claimableTasks.filter(t => t.id !== taskId);
        let newSubId = "SUB-" + String(Date.now()).slice(-6);
        pendingTasks.push({
            subId: newSubId,
            taskName: task.name,
            taskId: task.id,
            taskSource: task.source,
            type: task.type === "图像标注" ? "图片" : (task.type === "音频标注" ? "音频" : "文本"),
            status: "待标注"
        });
        renderClaimableGrid();
        renderPendingTable();
    }
}
function startQuality(subId) {
    alert(`开始质检任务: ${subId}\n在实际系统中会跳转到质检工作台。`);
}

// 筛选与分页事件绑定
function bindEvents() {
    // 待标注筛选
    document.getElementById("searchPendingBtn").onclick = () => { pendingSearch = document.getElementById("searchPending").value.toLowerCase(); pendingPage = 1; renderPendingTable(); };
    document.getElementById("resetPendingBtn").onclick = () => { document.getElementById("searchPending").value = ""; document.getElementById("typePendingFilter").value = ""; pendingSearch = ""; pendingTypeFilter = ""; pendingPage = 1; renderPendingTable(); };
    document.getElementById("typePendingFilter").onchange = () => { pendingTypeFilter = document.getElementById("typePendingFilter").value; pendingPage = 1; renderPendingTable(); };
    document.getElementById("pendingPrevBtn").onclick = () => { if (pendingPage > 1) { pendingPage--; renderPendingTable(); } };
    document.getElementById("pendingNextBtn").onclick = () => { renderPendingTable(); let total = Math.ceil(pendingTasks.filter(t => (pendingSearch === "" || t.taskName.toLowerCase().includes(pendingSearch)) && (pendingTypeFilter === "" || t.type === pendingTypeFilter)).length / pageSize); if (pendingPage < total) { pendingPage++; renderPendingTable(); } };
    
    // 可领取筛选
    document.getElementById("searchClaimableBtn").onclick = () => { claimableSearch = document.getElementById("searchClaimable").value.toLowerCase(); claimablePage = 1; renderClaimableGrid(); };
    document.getElementById("resetClaimableBtn").onclick = () => { document.getElementById("searchClaimable").value = ""; claimableSearch = ""; claimablePage = 1; renderClaimableGrid(); };
    document.getElementById("claimablePrevBtn").onclick = () => { if (claimablePage > 1) { claimablePage--; renderClaimableGrid(); } };
    document.getElementById("claimableNextBtn").onclick = () => { let total = Math.ceil(claimableTasks.filter(t => claimableSearch === "" || t.name.toLowerCase().includes(claimableSearch)).length / claimablePageSize); if (claimablePage < total) { claimablePage++; renderClaimableGrid(); } };
    
    // 质检筛选
    document.getElementById("searchQualityBtn").onclick = () => { qualitySearch = document.getElementById("searchQuality").value.toLowerCase(); qualityPage = 1; renderQualityTable(); };
    document.getElementById("resetQualityBtn").onclick = () => { document.getElementById("searchQuality").value = ""; qualitySearch = ""; qualityPage = 1; renderQualityTable(); };
    document.getElementById("qualityPrevBtn").onclick = () => { if (qualityPage > 1) { qualityPage--; renderQualityTable(); } };
    document.getElementById("qualityNextBtn").onclick = () => { let total = Math.ceil(qualityTasks.filter(t => qualitySearch === "" || t.taskName.toLowerCase().includes(qualitySearch) || t.subId.toLowerCase().includes(qualitySearch)).length / pageSize); if (qualityPage < total) { qualityPage++; renderQualityTable(); } };
    
    // 搜索输入框回车
    document.getElementById("searchPending").addEventListener("keypress", (e) => { if (e.key === "Enter") { pendingSearch = e.target.value.toLowerCase(); pendingPage = 1; renderPendingTable(); } });
    document.getElementById("searchClaimable").addEventListener("keypress", (e) => { if (e.key === "Enter") { claimableSearch = e.target.value.toLowerCase(); claimablePage = 1; renderClaimableGrid(); } });
    document.getElementById("searchQuality").addEventListener("keypress", (e) => { if (e.key === "Enter") { qualitySearch = e.target.value.toLowerCase(); qualityPage = 1; renderQualityTable(); } });
}

// Tab 点击事件
document.querySelectorAll(".tab").forEach(tab => {
    tab.onclick = () => switchTab(tab.getAttribute("data-tab"));
});

// 初始化
renderPendingTable();
renderClaimableGrid();
renderQualityTable();
bindEvents();
switchTab("annotation");
</script>
</body>
</html>
