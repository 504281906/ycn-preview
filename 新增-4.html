<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高质量数据集平台 - 上传本地文件</title>
    <style>
        :root {
            --primary: #1677ff;
            --primary-hover: #4096ff;
            --primary-light: #e6f4ff;
            --success: #52c41a;
            --success-light: #f6ffed;
            --warning: #faad14;
            --error: #ff4d4f;
            --text: #262626;
            --text-secondary: #595959;
            --text-tertiary: #8c8c8c;
            --border: #d9d9d9;
            --border-light: #f0f0f0;
            --bg-white: #ffffff;
            --radius: 8px;
            --radius-sm: 6px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif; background:#f0f2f5; height:100vh; overflow:hidden; display:flex; color:var(--text); font-size:14px; }

        .sidebar { width:220px; background:#1a1a2e; display:flex; flex-direction:column; height:100vh; position:fixed; left:0; top:0; z-index:100; }
        .sidebar-logo { padding:24px 20px; border-bottom:1px solid rgba(255,255,255,0.1); }
        .sidebar-logo h1 { font-size:16px; color:#fff; font-weight:600; }
        .sidebar-logo span { font-size:12px; color:var(--primary); display:block; margin-top:4px; }
        .sidebar-nav { flex:1; padding:12px 0; overflow-y:auto; }
        .nav-item { display:flex; align-items:center; padding:12px 20px; color:rgba(255,255,255,0.6); font-size:14px; cursor:pointer; gap:10px; border-right:3px solid transparent; }
        .nav-item:hover { background:rgba(255,255,255,0.05); color:#fff; }
        .nav-item.has-sub { justify-content:flex-start; }
        .nav-item.has-sub.open { background:rgba(74,158,255,0.15); color:var(--primary); border-right-color:var(--primary); }
        .nav-item .icon { width:20px; text-align:center; font-size:14px; font-weight:bold; color:#8c8c8c; flex-shrink:0; }
        .nav-item .text { flex:1; }
        .nav-item .arrow { font-size:10px; color:rgba(255,255,255,0.4); transition:transform 0.2s; }
        .nav-sub-list { display:none; background:rgba(0,0,0,0.15); }
        .nav-sub-list.open { display:block; }
        .nav-sub-item { display:flex; align-items:center; padding:10px 20px 10px 50px; color:rgba(255,255,255,0.5); font-size:13px; cursor:pointer; gap:8px; }
        .nav-sub-item:hover { color:#fff; background:rgba(255,255,255,0.05); }
        .nav-sub-item.active { color:var(--primary); }
        .nav-sub-item .dot { width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,0.3); flex-shrink:0; }
        .nav-sub-item.active .dot { background:var(--primary); }
        .sidebar-footer { padding:16px 20px; border-top:1px solid rgba(255,255,255,0.1); }
        .user-info { display:flex; align-items:center; gap:10px; }
        .user-avatar { width:32px; height:32px; background:var(--primary); border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-size:14px; }
        .user-name { font-size:13px; color:rgba(255,255,255,0.8); }
        .user-role { font-size:11px; color:rgba(255,255,255,0.4); }

        .main { margin-left:220px; flex:1; display:flex; flex-direction:column; height:100vh; overflow:hidden; }
        .topbar { height:56px; background:var(--bg-white); border-bottom:1px solid var(--border-light); display:flex; align-items:center; padding:0 24px; justify-content:space-between; }
        .topbar-breadcrumb { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-tertiary); }
        .topbar-breadcrumb a { color:var(--primary); text-decoration:none; }
        .topbar-actions { display:flex; gap:12px; }
        .content { flex:1; overflow-y:auto; padding:24px; }

        .form-section { background:var(--bg-white); border-radius:var(--radius); border:1px solid var(--border-light); padding:20px; margin-bottom:20px; }
        .form-section-title { font-size:14px; font-weight:600; color:var(--text); margin-bottom:16px; padding-bottom:10px; border-bottom:1px solid var(--border-light); }
        .form-row { display:grid; grid-template-columns:repeat(2,1fr); gap:20px; margin-bottom:16px; }
        .form-group { display:flex; flex-direction:column; gap:6px; }
        .form-label { font-size:13px; color:var(--text); font-weight:500; }
        .form-input, .form-select { height:36px; border:1px solid var(--border); border-radius:var(--radius-sm); padding:0 12px; font-size:14px; outline:none; background:var(--bg-white); width:100%; }
        .form-input:focus, .form-select:focus { border-color:var(--primary); box-shadow:0 0 0 2px rgba(22,119,255,0.1); }
        .form-actions { display:flex; gap:12px; margin-top:24px; padding-top:16px; border-top:1px solid var(--border-light); justify-content:flex-end; }

        .upload-area { border:2px dashed var(--border); border-radius:12px; padding:32px 24px; text-align:center; background:#fafafa; cursor:pointer; transition:all 0.2s; }
        .upload-area:hover { border-color:var(--primary); background:#f0f7ff; }
        .upload-area.drag-over { border-color:var(--primary); background:#e6f4ff; }
        .file-list { margin-top:16px; max-height:200px; overflow-y:auto; }
        .file-item { display:flex; justify-content:space-between; align-items:center; padding:8px 12px; background:#f8f9ff; border-radius:6px; margin-bottom:6px; font-size:12px; }
        .remove-file { color:var(--error); cursor:pointer; }

        .btn { height:34px; padding:0 16px; border-radius:var(--radius-sm); font-size:14px; cursor:pointer; border:none; display:inline-flex; align-items:center; justify-content:center; gap:6px; font-weight:500; }
        .btn-primary { background:var(--primary); color:#fff; }
        .btn-primary:hover { background:var(--primary-hover); }
        .btn-default { background:var(--bg-white); border:1px solid var(--border); color:var(--text); }
        .btn-default:hover { border-color:var(--primary); color:var(--primary); }
        .badge { display:inline-flex; align-items:center; justify-content:center; min-width:18px; height:18px; border-radius:9px; background:var(--error); color:#fff; font-size:11px; padding:0 5px; }
        .progress-bar { width:100%; height:6px; background:#f0f0f0; border-radius:3px; overflow:hidden; margin-top:12px; }
        .progress-fill { height:100%; background:var(--success); width:0%; transition:width 0.3s; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-logo">
        <h1>数据集管理平台</h1>
    </div>
    <div class="sidebar-nav">
        <div class="nav-item" onclick="location.href='工作台.html'"><span class="icon">◈</span><span class="text">工作台</span></div>
        <div class="nav-item" onclick="location.href='数据资源.html'"><span class="icon">☰</span><span class="text">数据资源</span></div>
        <div class="nav-item" onclick="location.href='数据集管理.html'"><span class="icon">▦</span><span class="text">数据集管理</span></div>
        <div class="nav-item" onclick="location.href='标注中心.html'"><span class="icon">✎</span><span class="text">标注中心</span></div>
        <div class="nav-item" onclick="location.href='专题库.html'"><span class="icon">▤</span><span class="text">专题库</span></div>
        <div class="nav-item" onclick="location.href='系统设置.html'"><span class="icon">⚙</span><span class="text">系统设置</span></div>
    </div>
</div>
</div>
<div class="main">
