<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实体关系标注 - 广东省文化馆</title>
    <style>
        :root {
            --primary: #1677ff;
            --primary-hover: #4096ff;
            --primary-light: #e6f4ff;
            --success: #52c41a;
            --success-light: #f6ffed;
            --warning: #faad14;
            --warning-light: #fff7e6;
            --error: #ff4d4f;
            --text: #262626;
            --text-secondary: #595959;
            --text-tertiary: #8c8c8c;
            --border: #d9d9d9;
            --border-light: #f0f0f0;
            --bg: #fafafa;
            --bg-white: #ffffff;
            --radius: 8px;
            --radius-sm: 6px;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.03);
            --shadow-hover: 0 4px 12px 0 rgba(0, 0, 0, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
            background: #f0f2f5;
            height: 100vh;
            overflow: hidden;
            display: flex;
            color: var(--text);
            font-size: 14px;
        }

        /* Left Sidebar */
        .sidebar { width: 200px; background: #1a1a2e; display: flex; flex-direction: column; height: 100vh; position: fixed; left: 0; top: 0; z-index: 10; }
        .sidebar-logo { padding: 20px 16px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-logo h1 { font-size: 14px; color: #fff; font-weight: 600; }
        .sidebar-logo span { font-size: 11px; color: var(--primary); display: block; margin-top: 4px; }
        .sidebar-nav { flex: 1; padding: 12px 0; overflow-y: auto; }
        .nav-item { display: flex; align-items: center; padding: 10px 16px; color: rgba(255,255,255,0.6); font-size: 13px; cursor: pointer; transition: all 0.2s; gap: 8px; user-select: none; border-right: 3px solid transparent; }
        .nav-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .nav-item.has-sub { justify-content: flex-start; }
        .nav-item.has-sub.open { background: rgba(74,158,255,0.15); color: var(--primary); border-right-color: var(--primary); }
        .nav-item .icon { width: 18px; text-align: center; font-size: 12px; color: #8c8c8c; flex-shrink: 0; }
        .nav-item .text { flex: 1; }
        .nav-item .arrow { font-size: 10px; color: rgba(255,255,255,0.4); transition: transform 0.2s; }
        .nav-item.has-sub.open .arrow { transform: rotate(90deg); }
        .nav-sub-list { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; background: rgba(0,0,0,0.15); }
        .nav-sub-item { display: flex; align-items: center; padding: 8px 16px 8px 42px; color: rgba(255,255,255,0.5); font-size: 12px; cursor: pointer; transition: all 0.2s; gap: 8px; }
        .nav-sub-item:hover { color: #fff; background: rgba(255,255,255,0.05); }
        .nav-sub-item.active { color: var(--primary); }
        .nav-sub-item .dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.3); flex-shrink: 0; }
        .nav-sub-item.active .dot { background: var(--primary); }
        .sidebar-footer { padding: 12px 16px; border-top: 1px solid rgba(255,255,255,0.1); }
        .user-info { display: flex; align-items: center; gap: 8px; }
        .user-avatar { width: 28px; height: 28px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; }
        .user-name { font-size: 12px; color: rgba(255,255,255,0.8); }
        .user-role { font-size: 10px; color: rgba(255,255,255,0.4); }

        /* Main area */
        .main { margin-left: 200px; flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* Topbar */
        .topbar {
            height: 48px;
            background: var(--bg-white);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            padding: 0 24px;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .topbar-breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-tertiary); }
        .topbar-breadcrumb span { color: var(--text); }
        .topbar-actions { display: flex; gap: 12px; }

        /* Button */
        .btn { height: 32px; padding: 0 14px; border-radius: var(--radius-sm); font-size: 13px; cursor: pointer; border: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s; font-weight: 500; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-default { background: var(--bg-white); border: 1px solid var(--border); color: var(--text); }
        .btn-default:hover { border-color: var(--primary); color: var(--primary); }

        /* Workbench */
        .workbench {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 12px 24px;
            background: #f0f2f5;
            max-height: 1000px;
            height: 1000px;
        }

        .wb-header {
            background: var(--bg-white);
            border-radius: var(--radius) var(--radius) 0 0;
            border: 1px solid var(--border-light);
            border-bottom: none;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .wb-header-left .wb-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
        .wb-header-left .wb-meta { font-size: 12px; color: var(--text-tertiary); display: flex; gap: 16px; flex-wrap: wrap; }
        .wb-header-right { display: flex; gap: 10px; align-items: center; }
        .divider-1, .divider-2, .divider-3 { height: 1px; background: var(--border-light); }

        /* 主体区域 */
        .wb-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg-white);
            border: 1px solid var(--border-light);
            border-top: none;
        }

        /* 文本内容区域 */
        .doc-section {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-light);
        }
        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 12px;
        }
        .doc-content {
            font-size: 14px;
            line-height: 2;
            color: var(--text);
        }
        .doc-paragraph {
            margin-bottom: 12px;
        }
        
        /* 实体高亮样式 - 标签在右上角 */
        .entity-mark {
            display: inline;
            position: relative;
            padding: 0 2px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .entity-mark:hover { opacity: 0.8; }
        .entity-person { background: rgba(22,119,255,0.12); color: #1677ff; border-radius: 4px; }
        .entity-work { background: rgba(255,77,79,0.12); color: #ff4d4f; border-radius: 4px; }
        .entity-role { background: rgba(114,46,209,0.12); color: #722ed1; border-radius: 4px; }
        .entity-time { background: rgba(250,173,20,0.12); color: #faad14; border-radius: 4px; }
        
        .entity-label {
            position: absolute;
            top: -10px;
            right: -2px;
            font-size: 9px;
            padding: 0px 4px;
            border-radius: 10px;
            font-weight: normal;
            white-space: nowrap;
            transform: scale(0.85);
            transform-origin: top right;
        }
        .entity-person .entity-label { background: #1677ff; color: #fff; }
        .entity-work .entity-label { background: #ff4d4f; color: #fff; }
        .entity-role .entity-label { background: #722ed1; color: #fff; }
        .entity-time .entity-label { background: #faad14; color: #fff; }

        /* 实体池区域 */
        .entity-section {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-light);
        }
        .entity-pool {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .entity-category {
            flex: 1;
            min-width: 180px;
        }
        .category-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 10px;
            padding-bottom: 4px;
            border-bottom: 1px solid var(--border-light);
        }
        .entity-item-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .entity-annotation-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 10px;
            background: #f9fafb;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            font-size: 12px;
            transition: all 0.2s;
        }
        .entity-annotation-item:hover { background: var(--bg-white); box-shadow: var(--shadow-sm); }
        .entity-annotation-text {
            font-weight: 500;
            color: var(--text);
        }
        .entity-annotation-type {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 12px;
            background: var(--primary-light);
            color: var(--primary);
        }
        .entity-person .entity-annotation-type { background: rgba(22,119,255,0.12); color: #1677ff; }
        .entity-work .entity-annotation-type { background: rgba(255,77,79,0.12); color: #ff4d4f; }
        .entity-role .entity-annotation-type { background: rgba(114,46,209,0.12); color: #722ed1; }
        .entity-time .entity-annotation-type { background: rgba(250,173,20,0.12); color: #faad14; }

        /* 关系标注区域 + 进度栏 */
        .relation-wrapper {
            flex: 1;
            display: flex;
            min-height: 0;
        }
        .relation-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 12px 20px;
        }
        .relation-toolbar {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .relation-tag-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .relation-tag {
            padding: 4px 12px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: var(--bg-white);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .relation-tag:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
        .relation-tag.active { background: var(--primary-light); border-color: var(--primary); color: var(--primary); font-weight: 500; }
        
        .mode-hint {
            margin-left: auto;
            font-size: 11px;
            padding: 4px 12px;
            border-radius: 20px;
            background: var(--warning-light);
            color: var(--warning);
        }
        .mode-hint.active {
            background: var(--success-light);
            color: var(--success);
        }
        
        /* 可视化画板 */
        .relation-canvas-container {
            flex: 1;
            position: relative;
            background: #fafafa;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-light);
            min-height: 200px;
            overflow: hidden;
            cursor: crosshair;
        }
        .relation-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .canvas-status {
            position: absolute;
            bottom: 8px;
            right: 12px;
            font-size: 10px;
            color: var(--text-tertiary);
            background: rgba(255,255,255,0.8);
            padding: 2px 8px;
            border-radius: 12px;
            pointer-events: none;
        }
        
        /* 关系列表 */
        .relation-list {
            max-height: 130px;
            overflow-y: auto;
            border-top: 1px solid var(--border-light);
            padding: 10px;
            margin-top: 10px;
            background: var(--bg-white);
        }
        .relation-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 10px;
            background: #f9fafb;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            margin-bottom: 6px;
            font-size: 11px;
        }
        .relation-card:last-child { margin-bottom: 0; }
        .relation-card-content {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .subject-badge { background: var(--primary-light); color: var(--primary); padding: 2px 8px; border-radius: 14px; font-size: 11px; font-weight: 500; }
        .predicate-badge { background: var(--success-light); color: var(--success); padding: 2px 8px; border-radius: 14px; font-size: 11px; }
        .object-badge { background: var(--warning-light); color: var(--warning); padding: 2px 8px; border-radius: 14px; font-size: 11px; font-weight: 500; }
        .delete-relation {
            color: var(--text-tertiary);
            cursor: pointer;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }
        .delete-relation:hover { color: var(--error); background: rgba(255,77,79,0.1); }

        /* 右侧进度栏 */
        .progress-sidebar {
            width: 240px;
            border-left: 1px solid var(--border-light);
            padding: 16px;
            display: flex;
            flex-direction: column;
            background: var(--bg-white);
        }
        .progress-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 12px;
        }
        .progress-item { display: flex; justify-content: space-between; padding: 8px 0; font-size: 12px; }
        .progress-item .label { color: var(--text-tertiary); }
        .progress-item .value { color: var(--text); font-weight: 500; }
        .progress-item .value.green { color: var(--success); }
        .progress-bar { height: 6px; background: var(--border-light); border-radius: 3px; overflow: hidden; margin-top: 8px; margin-bottom: 12px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), #69c0ff); border-radius: 3px; width: 43%; }

        /* Footer */
        .wb-footer {
            background: var(--bg-white);
            border: 1px solid var(--border-light);
            border-top: none;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 0 0 var(--radius) var(--radius);
        }
        .wb-footer-btns { display: flex; gap: 10px; }
        .wb-page-info { font-size: 12px; color: var(--text-tertiary); }
    </style>
</head>
