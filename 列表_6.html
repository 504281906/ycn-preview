<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>广东省文化馆 - 标注任务管理</title>
<style>
:root {
--primary: #1677ff;
--primary-hover: #4096ff;
--primary-light: #e6f4ff;
--success: #52c41a;
--success-light: #f6ffed;
--warning: #faad14;
--warning-light: #fff7e6;
--error: #ff4d4f;
--error-light: #fff1f0;
--text: #262626;
--text-secondary: #595959;
--text-tertiary: #8c8c8c;
--border: #d9d9d9;
--border-light: #f0f0f0;
--bg: #fafafa;
--bg-white: #ffffff;
--shadow: 0 1px 2px rgba(0,0,0,0.03),0 1px 6px -1px rgba(0,0,0,0.02);
--radius: 8px;
--radius-sm: 6px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif; background:#f0f2f5; height:100vh; overflow:hidden; display:flex; color:var(--text); font-size:14px; }

/* Sidebar */
.sidebar { width:220px; background:#1a1a2e; display:flex; flex-direction:column; height:100vh; position:fixed; left:0; top:0; z-index:100; }
.sidebar-logo { padding:24px 20px; border-bottom:1px solid rgba(255,255,255,0.1); }
.sidebar-logo h1 { font-size:16px; color:#fff; font-weight:600; }
.sidebar-logo span { font-size:12px; color:var(--primary); display:block; margin-top:4px; }
.sidebar-nav { flex:1; padding:12px 0; overflow-y:auto; }
.nav-item { display:flex; align-items:center; padding:12px 20px; color:rgba(255,255,255,0.6); font-size:14px; cursor:pointer; transition:all 0.2s; gap:10px; border-right:3px solid transparent; }
.nav-item:hover { background:rgba(255,255,255,0.05); color:#fff; }
.nav-item.active { background:rgba(74,158,255,0.15); color:var(--primary); border-right-color:var(--primary); }
.nav-item .icon { width:20px; text-align:center; font-size:14px; flex-shrink:0; }
.nav-item .text { flex:1; }
.sidebar-footer { padding:16px 20px; border-top:1px solid rgba(255,255,255,0.1); }
.user-info { display:flex; align-items:center; gap:10px; }
.user-avatar { width:32px; height:32px; background:var(--primary); border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-size:14px; }
.user-name { font-size:13px; color:rgba(255,255,255,0.8); }
.user-role { font-size:11px; color:rgba(255,255,255,0.4); }

/* Main */
.main { margin-left:220px; flex:1; display:flex; flex-direction:column; height:100vh; overflow:hidden; }
.topbar { height:56px; background:var(--bg-white); border-bottom:1px solid var(--border-light); display:flex; align-items:center; padding:0 24px; justify-content:space-between; }
.topbar-title { font-size:15px; color:var(--text); font-weight:500; }
.topbar-actions { display:flex; gap:12px; }
.content { flex:1; overflow-y:auto; padding:24px; }

/* Card */
.card { background:var(--bg-white); border-radius:var(--radius); box-shadow:var(--shadow); border:1px solid var(--border-light); }
.card-header { padding:16px 20px; border-bottom:1px solid var(--border-light); display:flex; justify-content:space-between; align-items:center; }
.card-header h3 { font-size:14px; font-weight:500; color:var(--text); }

/* Button */
.btn { height:34px; padding:0 16px; border-radius:var(--radius-sm); font-size:14px; cursor:pointer; border:none; display:inline-flex; align-items:center; gap:6px; transition:all 0.2s; font-weight:500; }
.btn-primary { background:var(--primary); color:#fff; }
.btn-primary:hover { background:var(--primary-hover); }
.btn-default { background:var(--bg-white); border:1px solid var(--border); color:var(--text); }
.btn-default:hover { border-color:var(--primary); color:var(--primary); }
.btn-compact { height:28px; padding:0 10px; font-size:12px; border-radius:4px; }

/* Status Tag */
.status-tag { display:inline-block; padding:2px 10px; border-radius:4px; font-size:12px; border:1px solid; }
.status-pending { background:#f5f5f5; color:var(--text-tertiary); border-color:var(--border); }
.status-progress { background:var(--primary-light); color:var(--primary); border-color:#91cfff; }
.status-review { background:var(--warning-light); color:var(--warning); border-color:#ffd591; }
.status-done { background:var(--success-light); color:var(--success); border-color:#b7eb8f; }
.status-timeout { background:var(--error-light); color:var(--error); border-color:#ffccc7; }

/* Table */
.data-table { width:100%; border-collapse:collapse; }
.data-table th { text-align:left; padding:10px 12px; font-size:12px; font-weight:500; color:var(--text-secondary); background:#fafafa; border-bottom:1px solid var(--border); white-space:nowrap; }
.data-table td { padding:10px 12px; font-size:12px; border-bottom:1px solid var(--border-light); }
.data-table tr:hover td { background:#f8f9ff; }

/* Progress Bar */
.progress-bar { height:6px; background:#f0f0f0; border-radius:3px; overflow:hidden; width:70px; display:inline-block; }
.progress-fill { height:100%; border-radius:3px; transition:width 0.3s; }
.progress-fill.primary { background:var(--primary); }
.progress-fill.green { background:var(--success); }
.progress-text { font-size:11px; margin-left:6px; color:var(--text-tertiary); }

/* Filter Bar */
.filter-bar { padding:12px 20px; display:flex; gap:12px; border-bottom:1px solid var(--border-light); flex-wrap:wrap; align-items:center; }
.filter-input { height:32px; border:1px solid var(--border); border-radius:6px; padding:0 12px; font-size:13px; width:160px; outline:none; }
.filter-input:focus { border-color:var(--primary); }
.filter-select { height:32px; border:1px solid var(--border); border-radius:6px; padding:0 12px; font-size:13px; width:130px; outline:none; background:var(--bg-white); cursor:pointer; }

/* Action Buttons */
.action-group { display:flex; gap:6px; flex-wrap:wrap; }
.action-btn { background:none; border:none; cursor:pointer; font-size:12px; padding:4px 6px; border-radius:4px; transition:all 0.2s; }
.action-btn.edit { color:var(--primary); }
.action-btn.edit:hover { background:var(--primary-light); }
.action-btn.stop { color:var(--warning); }
.action-btn.stop:hover { background:var(--warning-light); }
.action-btn.detail { color:var(--text-secondary); }
.action-btn.detail:hover { background:var(--border-light); }
.action-btn.delete { color:var(--error); }
.action-btn.delete:hover { background:var(--error-light); }

.badge { display:inline-flex; align-items:center; justify-content:center; min-width:18px; height:18px; border-radius:9px; background:var(--error); color:#fff; font-size:11px; padding:0 5px; }
</style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-logo"><h1>广东省文化馆</h1><span>非遗数字化保护平台</span></div>
    <div class="sidebar-nav">
        <a class="nav-item" href="#"><span class="icon">◈</span><span class="text">工作台</span></a>
        <a class="nav-item" href="#"><span class="icon">☰</span><span class="text">数字资源库</span></a>
        <a class="nav-item" href="#"><span class="icon">▦</span><span class="text">非遗数据集</span></a>
        <a class="nav-item active" href="#"><span class="icon">✎</span><span class="text">标注中心</span></a>
        <a class="nav-item" href="#"><span class="icon">▤</span><span class="text">专题库</span></a>
        <a class="nav-item" href="#"><span class="icon">⚙</span><span class="text">系统设置</span></a>
    </div>
    <div class="sidebar-footer"><div class="user-info"><div class="user-avatar">陈</div><div><div class="user-name">陈敏</div><div class="user-role">非遗保护专员</div></div></div></div>
</div>

<div class="main">
    <div class="topbar">
        <div class="topbar-title">标注中心 / 非遗标注任务管理</div>
        <div class="topbar-actions"><button class="btn btn-default">🔔 <span class="badge">3</span></button><button class="btn btn-default">⚙ 设置</button></div>
    </div>
    <div class="content">
        <div class="card">
            <div class="card-header">
                <h3>非遗标注任务列表</h3>
                <button class="btn btn-primary btn-compact" id="createTaskBtn">+ 新增任务</button>
            </div>
            <div class="filter-bar">
                <input type="text" id="searchInput" class="filter-input" placeholder="任务名称 / ID">
                <select id="typeFilter" class="filter-select"><option value="">全部类型</option><option value="文本">文本</option><option value="图片">图片</option><option value="视频">视频</option><option value="音频">音频</option><option value="多模态">多模态</option></select>
                <select id="statusFilter" class="filter-select"><option value="">全部状态</option><option value="待领取">待领取</option><option value="进行中">进行中</option><option value="待审核">待审核</option><option value="已完成">已完成</option><option value="超时">超时</option></select>
                <button class="btn btn-default btn-compact" id="searchBtn">查询</button>
                <button class="btn btn-default btn-compact" id="resetBtn">重置</button>
            </div>
            <div style="overflow-x:auto;">
                <table class="data-table">
                    <thead>
                        <tr><th>任务ID</th><th>任务名称</th><th>数据集ID</th><th>标注类型</th><th>状态</th><th>分发模式</th><th>子包数</th><th>标注员</th><th>质检员</th><th>创建人</th><th>创建时间</th><th>截止时间</th><th>标注完成率</th><th>质检完成率</th><th>准确率</th><th>操作</th></tr>
                    </thead>
                    <tbody id="taskTableBody"></tbody>
                </table>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding:12px 20px;">
                <div style="font-size:12px;color:var(--text-tertiary);">共 <strong id="totalCount">0</strong> 条记录</div>
                <div style="display:flex;gap:8px;">
                    <button class="btn btn-default btn-compact" id="prevPageBtn" disabled>‹ 上一页</button>
                    <span id="pageInfo" style="font-size:12px;color:var(--text-secondary);">第1页</span>
                    <button class="btn btn-default btn-compact" id="nextPageBtn">下一页 ›</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// 广东省文化馆 - 非遗标注任务模拟数据
let tasks = [
    { id: "NIC-001", name: "粤剧脸谱图像标注", datasetId: "DS-YJ-001", type: "图片", status: "已完成", distMode: "指定人员", subPackCount: 12, annotators: "陈敏,李华", reviewers: "王芳", creator: "张主任", createTime: "2025-02-01", deadline: "2025-03-01", receiveTime: "2025-02-02", submitTime: "2025-02-28", completionRate: 100, qualityRate: 98, accuracyRate: 97.5 },
    { id: "NIC-002", name: "广东音乐曲目情感标注", datasetId: "DS-GDYY-001", type: "音频", status: "进行中", distMode: "全员抢单", subPackCount: 8, annotators: "陈敏,赵雷", reviewers: "王芳", creator: "非遗保护中心", createTime: "2025-03-10", deadline: "2025-04-10", receiveTime: "2025-03-11", submitTime: null, completionRate: 68, qualityRate: 45, accuracyRate: null },
    { id: "NIC-003", name: "潮汕工夫茶艺视频动作识别", datasetId: "DS-CSGF-001", type: "视频", status: "进行中", distMode: "指定人员", subPackCount: 15, annotators: "李华,王芳", reviewers: "陈敏", creator: "潮州文化馆", createTime: "2025-03-05", deadline: "2025-04-20", receiveTime: "2025-03-06", submitTime: null, completionRate: 45, qualityRate: 38, accuracyRate: null },
    { id: "NIC-004", name: "广东醒狮表演文本描述标注", datasetId: "DS-XS-001", type: "文本", status: "待审核", distMode: "随机分配", subPackCount: 6, annotators: "赵雷", reviewers: "李华", creator: "佛山非遗中心", createTime: "2025-03-12", deadline: "2025-03-25", receiveTime: "2025-03-13", submitTime: "2025-03-24", completionRate: 100, qualityRate: 92, accuracyRate: 90 },
    { id: "NIC-005", name: "佛山木版年画图像分类", datasetId: "DS-FSNH-001", type: "图片", status: "待领取", distMode: "全员抢单", subPackCount: 5, annotators: "", reviewers: "", creator: "佛山博物馆", createTime: "2025-03-15", deadline: "2025-04-05", receiveTime: null, submitTime: null, completionRate: 0, qualityRate: null, accuracyRate: null },
    { id: "NIC-006", name: "客家山歌音频转写标注", datasetId: "DS-KJSG-001", type: "音频", status: "已完成", distMode: "指定人员", subPackCount: 10, annotators: "王芳,陈敏", reviewers: "李华", creator: "梅州非遗中心", createTime: "2025-02-10", deadline: "2025-03-10", receiveTime: "2025-02-11", submitTime: "2025-03-09", completionRate: 100, qualityRate: 99, accuracyRate: 98.5 },
    { id: "NIC-007", name: "岭南建筑构件三维标注", datasetId: "DS-LNJZ-001", type: "多模态", status: "超时", distMode: "指定人员", subPackCount: 8, annotators: "陈敏", reviewers: "王芳", creator: "华南理工团队", createTime: "2025-01-15", deadline: "2025-02-28", receiveTime: "2025-01-20", submitTime: null, completionRate: 55, qualityRate: 40, accuracyRate: null }
];

function saveTasksToStorage() { localStorage.setItem('gd_annotation_tasks', JSON.stringify(tasks)); }
function loadTasksFromStorage() {
    let stored = localStorage.getItem('gd_annotation_tasks');
    if (stored) { try { let parsed = JSON.parse(stored); if (Array.isArray(parsed) && parsed.length) tasks = parsed; } catch(e) {} }
    saveTasksToStorage();
}
loadTasksFromStorage();

let currentPage = 1;
const pageSize = 10;

function getStatusClass(status) {
    const map = { "待领取": "status-pending", "进行中": "status-progress", "待审核": "status-review", "已完成": "status-done", "超时": "status-timeout" };
    return map[status] || "status-pending";
}

function renderProgress(value) {
    if (value === null || value === undefined) return '<span style="color:var(--text-tertiary);">—</span>';
    let percent = typeof value === 'number' ? value : parseFloat(value);
    let fillClass = percent >= 80 ? 'green' : 'primary';
    return `<div style="display:flex;align-items:center;gap:4px;"><div class="progress-bar"><div class="progress-fill ${fillClass}" style="width:${percent}%;"></div></div><span class="progress-text">${percent}%</span></div>`;
}

function renderTable() {
    let search = document.getElementById("searchInput").value.toLowerCase();
    let typeFilter = document.getElementById("typeFilter").value;
    let statusFilter = document.getElementById("statusFilter").value;
    let filtered = tasks.filter(t => {
        let matchSearch = t.name.toLowerCase().includes(search) || t.id.toLowerCase().includes(search);
        let matchType = typeFilter === "" || t.type === typeFilter;
        let matchStatus = statusFilter === "" || t.status === statusFilter;
        return matchSearch && matchType && matchStatus;
    });
    let totalPages = Math.ceil(filtered.length / pageSize);
    if (currentPage > totalPages) currentPage = Math.max(1, totalPages);
    let start = (currentPage - 1) * pageSize;
    let paginated = filtered.slice(start, start + pageSize);
    let tbody = document.getElementById("taskTableBody");
    tbody.innerHTML = "";
    paginated.forEach(t => {
        let statusClass = getStatusClass(t.status);
        let row = `<tr>
            <td style="font-family:monospace;">${t.id}</td>
            <td><strong>${escapeHtml(t.name)}</strong></td>
            <td style="font-family:monospace;">${t.datasetId}</td>
            <td><span class="status-tag" style="background:var(--primary-light);color:var(--primary);">${t.type}</span></td>
            <td><span class="status-tag ${statusClass}">${t.status}</span></td>
            <td>${t.distMode}</td>
            <td>${t.subPackCount}</td>
            <td>${t.annotators || '—'}</td>
            <td>${t.reviewers || '—'}</td>
            <td>${t.creator}</td>
            <td style="font-size:11px;">${t.createTime}</td>
            <td style="font-size:11px;">${t.deadline}</td>
            <td>${renderProgress(t.completionRate)}</td>
            <td>${renderProgress(t.qualityRate)}</td>
            <td>${t.accuracyRate ? renderProgress(t.accuracyRate) : '<span style="color:var(--text-tertiary);">—</span>'}</td>
            <td class="action-group">
                <button class="action-btn edit" onclick="editTask('${t.id}')">编辑</button>
                <button class="action-btn stop" onclick="stopTask('${t.id}')">停止</button>
                <button class="action-btn detail" onclick="viewTask('${t.id}')">详情</button>
                <button class="action-btn delete" onclick="deleteTask('${t.id}')">删除</button>
            </td>
        </tr>`;
        tbody.insertAdjacentHTML('beforeend', row);
    });
    document.getElementById("totalCount").innerText = filtered.length;
    document.getElementById("pageInfo").innerText = `第${currentPage}页 / 共${totalPages || 1}页`;
    document.getElementById("prevPageBtn").disabled = currentPage <= 1;
    document.getElementById("nextPageBtn").disabled = currentPage >= totalPages;
}

function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

function editTask(id) { window.location.href = `gd_标注任务_编辑.html?id=${id}`; }
function viewTask(id) { window.location.href = `gd_标注任务_详情.html?id=${id}`; }

function stopTask(id) {
    let task = tasks.find(t => t.id === id);
    if (task && task.status !== "已完成" && task.status !== "超时") {
        if (confirm(`确定要停止任务 "${task.name}" 吗？`)) {
            task.status = "超时";
            saveTasksToStorage();
            renderTable();
            alert(`任务 ${id} 已停止`);
        }
    } else { alert("已完成或已超时的任务无法停止"); }
}

function deleteTask(id) {
    if (confirm(`确定删除任务 ${id} 吗？`)) {
        let idx = tasks.findIndex(t => t.id === id);
        if (idx !== -1) { tasks.splice(idx, 1); saveTasksToStorage(); if (tasks.length === 0 && currentPage > 1) currentPage--; renderTable(); }
    }
}

function resetFilters() {
    document.getElementById("searchInput").value = "";
    document.getElementById("typeFilter").value = "";
    document.getElementById("statusFilter").value = "";
    currentPage = 1;
    renderTable();
}
function prevPage() { if (currentPage > 1) { currentPage--; renderTable(); } }
function nextPage() {
    let search = document.getElementById("searchInput").value.toLowerCase();
    let typeFilter = document.getElementById("typeFilter").value;
    let statusFilter = document.getElementById("statusFilter").value;
    let filtered = tasks.filter(t => {
        let matchSearch = t.name.toLowerCase().includes(search) || t.id.toLowerCase().includes(search);
        let matchType = typeFilter === "" || t.type === typeFilter;
        let matchStatus = statusFilter === "" || t.status === statusFilter;
        return matchSearch && matchType && matchStatus;
    });
    let totalPages = Math.ceil(filtered.length / pageSize);
    if (currentPage < totalPages) { currentPage++; renderTable(); }
}

document.getElementById("createTaskBtn").onclick = () => { window.location.href = "gd_标注任务_编辑.html"; };
document.getElementById("searchBtn").onclick = () => { currentPage = 1; renderTable(); };
document.getElementById("resetBtn").onclick = resetFilters;
document.getElementById("prevPageBtn").onclick = prevPage;
document.getElementById("nextPageBtn").onclick = nextPage;
document.getElementById("searchInput").addEventListener("keypress", (e) => { if (e.key === "Enter") { currentPage = 1; renderTable(); } });
renderTable();
</script>
</body>
</html>
