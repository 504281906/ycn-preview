<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>广东省文化馆 - 专题卡片列表</title>
<style>
:root {
    --primary: #1677ff;
    --primary-hover: #4096ff;
    --primary-light: #e6f4ff;
    --success: #52c41a;
    --success-light: #f6ffed;
    --warning: #faad14;
    --warning-light: #fff7e6;
    --error: #ff4d4f;
    --error-light: #fff1f0;
    --text: #262626;
    --text-secondary: #595959;
    --text-tertiary: #8c8c8c;
    --border: #d9d9d9;
    --border-light: #f0f0f0;
    --bg: #f0f2f5;
    --bg-white: #ffffff;
    --shadow: 0 1px 2px rgba(0,0,0,0.03), 0 1px 6px -1px rgba(0,0,0,0.02);
    --radius: 8px;
    --radius-sm: 6px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    background: var(--bg);
    height: 100vh;
    overflow: hidden;
    display: flex;
    color: var(--text);
    font-size: 14px;
}
.sidebar {
    width: 220px;
    background: #001529;
    display: flex;
    flex-direction: column;
    height: 100vh;
    position: fixed;
    left: 0;
    top: 0;
    z-index: 100;
}
.sidebar-logo {
    padding: 24px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
}
.sidebar-logo h1 {
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    letter-spacing: 1px;
}
.sidebar-logo span {
    font-size: 11px;
    color: var(--primary);
    display: block;
    margin-top: 4px;
    opacity: 0.8;
}
.sidebar-nav {
    flex: 1;
    padding: 12px 0;
    overflow-y: auto;
}
.nav-item {
    display: flex;
    align-items: center;
    padding: 10px 20px;
    color: rgba(255,255,255,0.65);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    gap: 10px;
    border-left: 2px solid transparent;
}
.nav-item:hover {
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.9);
}
.nav-item.active {
    background: rgba(22,119,255,0.15);
    color: var(--primary);
    border-left-color: var(--primary);
}
.nav-item .icon { width: 20px; text-align: center; font-size: 13px; flex-shrink: 0; }
.nav-item .text { flex: 1; }
.nav-sub {
    margin-left: 28px;
    padding-left: 12px;
    border-left: 1px solid rgba(255,255,255,0.1);
    margin-top: 6px;
    margin-bottom: 8px;
}
.nav-sub-item {
    display: flex;
    align-items: center;
    padding: 8px 16px;
    color: rgba(255,255,255,0.5);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    gap: 8px;
    border-radius: var(--radius-sm);
}
.nav-sub-item:hover {
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.9);
}
.nav-sub-item.active {
    background: rgba(22,119,255,0.2);
    color: var(--primary);
}
.nav-sub-item .dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
    flex-shrink: 0;
}
.nav-sub-item.active .dot { background: var(--primary); }
.sidebar-footer {
    padding: 16px 20px;
    border-top: 1px solid rgba(255,255,255,0.1);
}
.user-info {
    display: flex;
    align-items: center;
    gap: 10px;
}
.user-avatar {
    width: 32px;
    height: 32px;
    background: var(--primary);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 13px;
    font-weight: 500;
}
.user-name { font-size: 12px; color: rgba(255,255,255,0.8); }
.user-role { font-size: 10px; color: rgba(255,255,255,0.4); }
.main {
    margin-left: 220px;
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
}
.topbar {
    height: 56px;
    background: var(--bg-white);
    border-bottom: 1px solid var(--border-light);
    display: flex;
    align-items: center;
    padding: 0 24px;
    justify-content: space-between;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
}
.topbar-title {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
}
.topbar-actions { display: flex; gap: 12px; }
.content {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
}
.card {
    background: var(--bg-white);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1px solid var(--border-light);
    margin-bottom: 20px;
}
.card-header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border-light);
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.card-header h3 {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
}
.btn {
    height: 32px;
    padding: 0 14px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-default {
    background: var(--bg-white);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-weight: 400;
}
.btn-default:hover { border-color: var(--primary); color: var(--primary); }
.btn-compact { height: 28px; padding: 0 10px; font-size: 12px; border-radius: 4px; }
.card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
    padding: 20px;
}
.topic-card {
    background: var(--bg-white);
    border: 1px solid var(--border-light);
    border-radius: var(--radius);
    padding: 18px;
    cursor: pointer;
    transition: all 0.2s;
}
.topic-card:hover {
    border-color: var(--primary);
    box-shadow: var(--shadow);
    transform: translateY(-2px);
}
.topic-card h4 {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 8px;
}
.topic-card .topic-id {
    font-size: 11px;
    color: var(--text-tertiary);
    margin-bottom: 12px;
    font-family: monospace;
}
.topic-stats {
    display: flex;
    gap: 16px;
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border-light);
}
.status-tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    border: 1px solid;
}
.status-active {
    background: var(--success-light);
    color: var(--success);
    border-color: #b7eb8f;
}
.filter-bar {
    padding: 12px 20px;
    display: flex;
    gap: 12px;
    border-bottom: 1px solid var(--border-light);
}
.filter-input {
    height: 32px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0 12px;
    font-size: 13px;
    width: 200px;
    outline: none;
}
.filter-input:focus { border-color: var(--primary); }
</style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-logo">
        <h1>广东省文化馆</h1>
        <span>非遗数字化保护平台</span>
    </div>
    <div class="sidebar-nav">
        <div class="nav-item"><span class="icon">◈</span><span class="text">工作台</span></div>
        <div class="nav-item"><span class="icon">☰</span><span class="text">数据资源</span></div>
        <div class="nav-item"><span class="icon">▦</span><span class="text">数据集管理</span></div>
        <div class="nav-item"><span class="icon">▤</span><span class="text">专题库</span></div>
        <div class="nav-item"><span class="icon">✎</span><span class="text">标注中心</span></div>
        <div class="nav-item"><span class="icon">⚙</span><span class="text">系统设置</span></div>
        </div>
    <div class="sidebar-footer">
        <div class="user-info">
            <div class="user-avatar">陈</div>
            <div><div class="user-name">陈敏</div><div class="user-role">非遗保护专员</div></div>
        </div>
    </div>
</div>
<div class="main">
    <div class="topbar">
        <div class="topbar-title">专题库 / 专题视图</div>
        <div class="topbar-actions"><button class="btn btn-default btn-compact">帮助</button></div>
    </div>
    <div class="content">
        <div class="card">
            <div class="card-header"><h3>非遗专题卡片列表</h3></div>
            <div class="filter-bar">
                <input type="text" id="searchInput" class="filter-input" placeholder="专题名称 / ID">
                <button class="btn btn-default btn-compact" id="searchBtn">查询</button>
            </div>
            <div id="cardContainer" class="card-grid"></div>
        </div>
    </div>
</div>
<script>
const topics = [
    { id: "GD-ICH-001", name: "岭南非物质文化遗产专题", category: "非遗综合", recordCount: 156, dataCount: 12450, status: "启用" },
    { id: "GD-ICH-002", name: "广东传统节庆民俗专题", category: "民俗文化", recordCount: 89, dataCount: 8750, status: "启用" },
    { id: "GD-ICH-003", name: "岭南传统建筑技艺专题", category: "传统技艺", recordCount: 47, dataCount: 3420, status: "启用" },
    { id: "GD-ICH-004", name: "广东戏曲曲艺专题", category: "传统戏剧", recordCount: 63, dataCount: 5630, status: "停用" }
];
function renderCards() {
    let search = document.getElementById("searchInput").value.toLowerCase();
    let filtered = topics.filter(t => t.name.toLowerCase().includes(search) || t.id.toLowerCase().includes(search));
    let container = document.getElementById("cardContainer");
    container.innerHTML = "";
    filtered.forEach(t => {
        let statusClass = t.status === "启用" ? "status-active" : "";
        let card = `<div class="topic-card" onclick="location.href='专题详情.html?topicId=${t.id}'">
            <h4>${t.name}</h4>
            <div class="topic-id">${t.id}</div>
            <div style="font-size:12px;color:var(--text-secondary);margin:8px 0;">分类：${t.category}</div>
            <div class="topic-stats"><span>数据条目: ${t.dataCount.toLocaleString()}</span><span>资源数: ${t.recordCount}</span></div>
            <div style="margin-top:10px;"><span class="status-tag ${statusClass}">${t.status}</span></div>
        </div>`;
        container.insertAdjacentHTML('beforeend', card);
    });
}
document.getElementById("searchBtn").onclick = renderCards;
document.getElementById("searchInput").addEventListener("keypress", (e) => { if (e.key === "Enter") renderCards(); });
renderCards();
</script>
</body>
</html>
